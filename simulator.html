<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuilt — 3D Builder</title>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#1ea855;--gd:#178a44;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    canvas{display:block;width:100%;height:100vh;cursor:crosshair}
    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:5px 8px;display:flex;align-items:center;justify-content:space-between;gap:3px;flex-wrap:wrap}
    .top .logo{font-size:13px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:4px;text-decoration:none}.top .logo em{font-style:normal;color:var(--g)}
    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--w);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--w)}.tb.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:4px;top:48px;bottom:4px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:220px}
    .side h3{font-size:9px;font-weight:700;color:var(--w)}
    .tabs{display:flex;gap:1px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:var(--w)}
    .items{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(30,168,85,.06)}
    .it .i{font-size:14px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6px;color:rgba(30,168,85,.4)}
    .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:2px;vertical-align:middle;border:1px solid rgba(255,255,255,.1)}
    .pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:500px;width:90%}.pop.show{display:block}.pop h3{font-size:15px;color:var(--w);margin-bottom:6px}.pop p{font-size:11px;color:var(--s);margin-bottom:10px}
    .prebox{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .pr{background:var(--n3);border:1.5px solid var(--b);border-radius:6px;padding:8px;cursor:pointer;transition:.15s}.pr:hover{border-color:var(--g)}.pr .pi{font-size:18px}.pr .pn{font-size:9px;font-weight:600;color:var(--w)}.pr .ps{font-size:7px;color:var(--s)}
    #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.18);font-size:10px;pointer-events:none;z-index:40}
    .hl{position:fixed;pointer-events:none;z-index:45;background:rgba(10,14,20,.9);border:1px solid var(--g);border-radius:6px;padding:4px 10px;font-size:10px;font-family:Inter;color:var(--w);white-space:nowrap;display:none}.hl .hlp{color:var(--g);font-size:9px}
    @media(max-width:700px){.side{width:180px;left:2px}}@media(max-width:500px){.side{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Pick item from catalog → click ground · R to rotate · Scroll to zoom</div>
<div class="hl" id="hl"><span id="hln"></span><br><span class="hlp" id="hlp"></span></div>
<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Built</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" onclick="toggleGrid()">📐 Grid ON</button>
  <button class="tb" onclick="showPre()">🏘️ Prebuilds</button>
  <button class="tb" onclick="showMap()">🌍 Map</button>
  <button class="tb" onclick="doUndo()">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="budget">💰 $100,000</span>
  <button class="tb" onclick="showSave()">💾 Save</button>
  <button class="tb red" onclick="doClear()">Clear</button>
</div>
<div class="side"><h3>📦 Catalog</h3>
  <div class="tabs">
    <button class="tab on" data-cat="walls" onclick="switchTab('walls')">🧱</button>
    <button class="tab" data-cat="windows" onclick="switchTab('windows')">🪟</button>
    <button class="tab" data-cat="doors" onclick="switchTab('doors')">🚪</button>
    <button class="tab" data-cat="floors" onclick="switchTab('floors')">🟫</button>
    <button class="tab" data-cat="furniture" onclick="switchTab('furniture')">🛋️</button>
    <button class="tab" data-cat="kitchen" onclick="switchTab('kitchen')">🍳</button>
    <button class="tab" data-cat="outdoor" onclick="switchTab('outdoor')">🌳</button>
    <button class="tab" data-cat="roofs" onclick="switchTab('roofs')">🏠</button>
  </div>
  <div class="items" id="items"></div>
</div>
<div class="pop" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click to load.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" onclick="document.getElementById('prePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="savePop"><h3>💾 Save</h3><input id="pnInput" style="width:100%;padding:10px;background:var(--n3);border:1px solid var(--b);border-radius:6px;color:var(--w);font-size:13px;font-family:Inter;outline:none;margin-bottom:10px" placeholder="My Dream Home"><button class="tb" onclick="doSave()" style="background:var(--g);color:var(--w);width:100%">💾 Save</button><div style="margin-top:6px"><button class="tb" onclick="document.getElementById('savePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="mapPop" style="max-width:90vw"><h3>🌍 Global Projects</h3><div id="mapContainer" style="width:80vw;max-width:900px;height:500px;border-radius:8px;overflow:hidden;margin:0 auto"></div><div style="margin-top:10px;display:flex;gap:6px;justify-content:center"><button class="tb on" data-mm="all">All</button><button class="tb" data-mm="active">Active</button><button class="tb" data-mm="density">Density</button><button class="tb" data-mm="relief">Relief</button></div><div style="margin-top:8px"><button class="tb" onclick="document.getElementById('mapPop').classList.remove('show')">Close</button></div></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var _mapLoaded=false;
function showMap(){
  document.getElementById('mapPop').classList.add('show');
  if(_mapLoaded)return;_mapLoaded=true;
  setTimeout(function(){
    var mc=document.getElementById('mapContainer');if(!mc)return;
    var map=L.map(mc,{scrollWheelZoom:false,zoomControl:true,attributionControl:false}).setView([35,8],3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
    var ac=[{n:'Kosovo',t:42.6,o:21,s:'active',c:104},{n:'USA',t:39.5,o:-98,s:'active',c:340},{n:'Austria',t:47.5,o:14.5,s:'active',c:70},{n:'Switzerland',t:46.8,o:8.2,s:'active',c:15}];
    var cls={active:'#1ea855',expanding:'#f59e0b'};
    ac.forEach(function(p){var ic=L.divIcon({className:'',html:'<div style="width:12px;height:12px;background:'+cls[p.s]+';border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px '+cls[p.s]+'44"></div>',iconSize:[12,12],iconAnchor:[6,6]});L.marker([p.t,p.o],{icon:ic}).addTo(map).bindPopup('<div style="color:#333;font-size:12px"><strong>'+p.n+'</strong><br>'+p.c+' projects</div>')});
    mc._map=map;new ResizeObserver(function(){map.invalidateSize()}).observe(mc);
  },200);
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

var W={};W.scene=null;W.camera=null;W.controls=null;W.renderer=null;
W.mode='place';W.gridOn=true;W.budget=100000;W.sel=null;W.catKey='walls';
W.placeRot=0;W.placed=[];W.undoStack=[];W.allItems={};
W.moveTarget=null;W.ghost=null;
window._W=W;

var canvas=document.getElementById('c');
W.renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
W.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
W.renderer.shadowMap.enabled=true;
W.renderer.toneMapping=THREE.ACESFilmicToneMapping;
W.renderer.toneMappingExposure=1.15;

W.scene=new THREE.Scene();
W.scene.background=new THREE.Color('#c8dff0');
W.scene.fog=new THREE.Fog('#c8dff0',30,70);

W.camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,60);
W.camera.position.set(8,7,10);
W.controls=new OrbitControls(W.camera,W.renderer.domElement);
W.controls.target.set(0,0.5,0);
W.controls.enableDamping=true;
W.controls.dampingFactor=0.08;
W.controls.minDistance=2;
W.controls.maxDistance=30;
W.controls.maxPolarAngle=Math.PI*0.52;
W.controls.update();

W.scene.add(new THREE.AmbientLight('#e8f0f8',1.0));
var sun=new THREE.DirectionalLight('#fffef8',2.5);
sun.position.set(14,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;
sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;
W.scene.add(sun);
W.scene.add(new THREE.HemisphereLight('#d8e8f8','#6a7a50',0.4));

W.gridH=new THREE.GridHelper(50,50,'#1ea855','#c0c8c0');
W.gridH.position.set(0,0.005,0);W.scene.add(W.gridH);

var ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#4a6a3a',roughness:0.85}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;W.scene.add(ground);

// Materials
function mat(o){return new THREE.MeshStandardMaterial(o)}
var M={};
M.steel=mat({color:'#5a6878',roughness:0.3,metalness:0.85});
M.glass=mat({color:'#c8ddf8',roughness:0.03,metalness:0.05,transparent:true,opacity:0.45});
M.wood=mat({color:'#c09870',roughness:0.5});
M.brick=mat({color:'#b05040',roughness:0.55});
M.white=mat({color:'#f5f5f0',roughness:0.4});
M.beige=mat({color:'#e8dfd2',roughness:0.45});
M.gray=mat({color:'#9ca8b4',roughness:0.45});
M.navy=mat({color:'#2a3a55',roughness:0.45});
M.door=mat({color:'#2a3545',roughness:0.2,metalness:0.55});
M.silver=mat({color:'#d0d0d0',roughness:0.15,metalness:0.7});
M.oak=mat({color:'#c4a882',roughness:0.5});
M.walnut=mat({color:'#5c3d2e',roughness:0.45});
M.cabinet=mat({color:'#6b4a2e',roughness:0.45});
M.sofaC=mat({color:'#e8e4dc',roughness:0.45});
M.sofaT=mat({color:'#c4b8a8',roughness:0.45});
M.mattress=mat({color:'#f8f4ec',roughness:0.6});
M.bedFrame=mat({color:'#8b6f4a',roughness:0.5});
M.leaf=mat({color:'#3d6b2e',roughness:0.65});
M.bark=mat({color:'#6b4d3a',roughness:0.8});
M.bush=mat({color:'#4a7a3a',roughness:0.6});
M.pool=mat({color:'#4080c0',roughness:0.15,metalness:0.2});
M.fountain=mat({color:'#b0b0b0',roughness:0.25});
M.path=mat({color:'#c8c0b8',roughness:0.55});
M.lantern=mat({color:'#f0a030',roughness:0.3,emissive:'#f0a030',emissiveIntensity:0.3});
M.roof=mat({color:'#3d4855',roughness:0.4});
M.roofMetal=mat({color:'#8899aa',roughness:0.22,metalness:0.55});
M.roofTerra=mat({color:'#b55a3a',roughness:0.4});
M.conc=mat({color:'#c4c8ce',roughness:0.7});
M.rug=mat({color:'#8b7355',roughness:0.8});
M.tile=mat({color:'#d8d4d0',roughness:0.3});
M.marble=mat({color:'#e8e0d8',roughness:0.12});
M.darkW=mat({color:'#4a2a1a',roughness:0.4});
M.grass=mat({color:'#5a8a3e',roughness:0.8});

function box(w,h,d,m){var g=new THREE.BoxGeometry(w,h,d);var o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o}
function cyl(r,h,m,s){s=s||8;var o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m);o.castShadow=true;return o}
function sph(r,m,s){s=s||6;var o=new THREE.Mesh(new THREE.SphereGeometry(r,s,4),m);o.castShadow=true;return o}
function G(){var g=new THREE.Group();for(var i=0;i<arguments.length;i++)g.add(arguments[i]);return g}
function set(g,x,y,z,ry){g.position.set(x||0,y||0,z||0);g.rotation.y=ry||0;return g}

// Furniture
function mkSofa(){var g=G(box(1.8,0.45,0.7,M.sofaC),box(1.8,0.55,0.06,M.sofaC),box(0.07,0.3,0.7,M.sofaC),box(0.07,0.3,0.7,M.sofaC));g.children[1].position.set(0,0.48,-0.33);g.children[2].position.set(-0.9,0.15,0);g.children[3].position.set(0.9,0.15,0);return g}
function mkSofaSmall(){var g=G(box(1.2,0.4,0.6,M.sofaT),box(1.2,0.5,0.05,M.sofaT),box(0.06,0.25,0.6,M.sofaT),box(0.06,0.25,0.6,M.sofaT));g.children[1].position.set(0,0.43,-0.28);g.children[2].position.set(-0.57,0.12,0);g.children[3].position.set(0.57,0.12,0);return g}
function mkChair(){var g=G(box(0.35,0.1,0.35,M.sofaT),box(0.35,0.45,0.04,M.sofaT),cyl(0.022,0.35,M.oak),cyl(0.022,0.35,M.oak),cyl(0.022,0.35,M.oak),cyl(0.022,0.35,M.oak));g.children[1].position.set(0,0.25,-0.15);g.children[2].position.set(-0.14,-0.22,-0.14);g.children[3].position.set(0.14,-0.22,-0.14);g.children[4].position.set(-0.14,-0.22,0.14);g.children[5].position.set(0.14,-0.22,0.14);return g}
function mkTable(){var g=G(box(1.3,0.03,0.85,M.oak),cyl(0.025,0.68,M.oak),cyl(0.025,0.68,M.oak),cyl(0.025,0.68,M.oak),cyl(0.025,0.68,M.oak));g.children[1].position.set(-0.6,-0.35,-0.4);g.children[2].position.set(0.6,-0.35,-0.4);g.children[3].position.set(-0.6,-0.35,0.4);g.children[4].position.set(0.6,-0.35,0.4);return g}
function mkBed(){var g=G(box(1.5,0.05,2,M.bedFrame),box(1.4,0.2,1.9,M.mattress),box(1.5,0.55,0.04,M.bedFrame));g.children[1].position.set(0,0.12,0);g.children[2].position.set(0,0.3,-0.98);return g}
function mkTV(){var g=G(box(1.1,0.25,0.22,M.oak),box(1.05,0.015,0.6,M.silver),box(0.03,0.015,0.6,M.silver));g.children[1].position.set(0,0.13,0.12);g.children[2].position.set(-0.52,0.13,0.12);return g}
function mkShelf(){var g=G(box(0.85,1.6,0.3,M.cabinet));for(var i=0;i<5;i++){var s=box(0.82,0.02,0.28,M.walnut);s.position.y=-0.65+i*0.38;g.add(s)}for(var i=0;i<3;i++){var bk=box(0.1,0.12+i*0.02,0.18,M.sofaT);bk.position.set(-0.2+i*0.14,-0.48+i*0.38,0.06);bk.castShadow=true;g.add(bk)}return g}
function mkDesk(){var g=G(box(1.2,0.03,0.55,M.oak),cyl(0.02,0.7,M.oak),cyl(0.02,0.7,M.oak),cyl(0.02,0.7,M.oak),cyl(0.02,0.7,M.oak));g.children[1].position.set(-0.55,-0.36,-0.25);g.children[2].position.set(0.55,-0.36,-0.25);g.children[3].position.set(-0.55,-0.36,0.25);g.children[4].position.set(0.55,-0.36,0.25);return g}
function mkLamp(){var g=G(cyl(0.03,1.2,M.silver),cyl(0.025,0.6,M.silver));var shade=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.22,0.3,12),M.lantern);shade.position.y=1.0;shade.castShadow=true;g.add(shade);return g}
function mkMirror(){var g=G(box(0.55,0.02,0.85,M.silver),box(0.6,0.03,0.03,M.oak),box(0.6,0.03,0.03,M.oak),box(0.03,0.03,0.85,M.oak),box(0.03,0.03,0.85,M.oak));g.children[1].position.set(0,0.42,0);g.children[2].position.set(0,-0.42,0);g.children[3].position.set(-0.28,0,0);g.children[4].position.set(0.28,0,0);return g}
function mkCounter(){var g=G(box(1.7,0.42,0.58,M.white),box(1.74,0.02,0.6,M.oak),box(0.025,0.015,0.42,M.silver));g.children[1].position.set(0,0.21,0);g.children[2].position.set(0,0.15,0.28);return g}
function mkFridge(){var g=G(box(0.6,1.7,0.6,M.silver),box(0.58,0.015,0.06,M.silver),box(0.58,0.015,0.06,M.silver));g.children[1].position.set(0,0.5,0.29);g.children[2].position.set(0,-0.3,0.29);return g}
function mkSink(){return G(box(0.75,0.02,0.45,M.silver),box(0.65,0.01,0.35,M.silver))}
function mkStove(){var g=G(box(0.55,0.03,0.45,M.silver));for(var x=-0.14;x<=0.14;x+=0.14)for(var z=-0.14;z<=0.14;z+=0.14){var bnr=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.01,8),M.silver);bnr.position.set(x,0.02,z);g.add(bnr)}return g}
function mkIsland(){var g=G(box(1.4,0.42,0.8,M.white),box(1.44,0.02,0.82,M.oak),box(0.04,0.28,0.025,M.oak),box(0.04,0.28,0.025,M.oak));g.children[1].position.set(0,0.21,0);g.children[2].position.set(-0.66,0.14,0.39);g.children[3].position.set(0.66,0.14,0.39);return g}
function mkCabinet(){return G(box(0.8,0.4,0.45,M.cabinet),box(0.78,0.02,0.43,M.walnut),box(0.02,0.015,0.38,M.silver))}
function mkRug(){var r=new THREE.Mesh(new THREE.BoxGeometry(2,0.01,1.5),M.rug);r.castShadow=false;r.receiveShadow=true;return r}
function mkPlantS(){var g=G(cyl(0.04,0.3,M.oak,6));var c=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.3,8),M.leaf);c.position.y=0.25;c.castShadow=true;g.add(c);return g}
function mkPlantM(){var g=G(cyl(0.05,0.5,M.oak,6));var c=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.4,8),M.leaf);c.position.y=0.4;c.castShadow=true;g.add(c);return g}
function mkPlantTall(){var g=G(cyl(0.04,0.8,M.oak,6));var c=new THREE.Mesh(new THREE.ConeGeometry(0.25,0.35,8),M.leaf);c.position.y=0.55;c.castShadow=true;g.add(c);return g}

// Helpers
function hint(t){document.getElementById('hint').textContent=t}
function updB(){document.getElementById('budget').textContent='💰 $'+(W.budget-W.total).toLocaleString()}
function snap(v){return W.gridOn?Math.round(v/0.5)*0.5:v}
function makeObj(it){if(!it||!it.mk)return box(1,1,1,M.white);try{return it.mk()}catch(e){return box(1,1,1,M.white)}}

function groundPos(e){
  var rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1),W.camera);
  var pt=new THREE.Vector3();
  if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),pt))return null;
  if(Math.abs(pt.x)>24||Math.abs(pt.z)>24)return null;
  return new THREE.Vector3(snap(pt.x),0.01,snap(pt.z));
}

function findTarget(e){
  var x=e?(e.clientX/innerWidth)*2-1:0;
  var y=e?-(e.clientY/innerHeight)*2+1:0;
  var rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(x,y),W.camera);
  var hits=rc.intersectObjects(W.placed,true);if(!hits.length)return null;
  var t=hits[0].object;
  while(t.parent&&t.parent!==W.scene&&W.placed.includes(t.parent))t=t.parent;
  return W.placed.includes(t)?t:null;
}

function place(e){
  if(!W.sel||W.mode!=='place')return;
  var pos=groundPos(e);if(!pos)return;
  pos.y=W.sel.w?1.4:0.01;
  var obj=makeObj(W.sel);obj.position.copy(pos);
  if(W.placeRot!==0)obj.rotation.y=W.placeRot;
  else if(W.sel.w){var d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();obj.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
  obj.userData={id:W.sel.id,price:W.sel.p,name:W.sel.n,canRot:true};
  W.scene.add(obj);W.placed.push(obj);W.undoStack.push(obj);
  if(W.undoStack.length>50)W.undoStack.shift();
  W.total+=W.sel.p;W.placeRot=0;updB();hint('Placed: '+W.sel.n);
}

function handleClick(e){
  if(W.mode==='place'){place(e);return}
  var t=findTarget(e);if(!t)return;
  if(W.mode==='delete'){W.total-=(t.userData.price||0);W.scene.remove(t);W.placed.splice(W.placed.indexOf(t),1);updB();hint('Deleted')}
  else if(W.mode==='rotate'){t.rotation.y+=Math.PI/2;hint('Rotated 90°')}
  else if(W.mode==='move'){W.placed.forEach(function(o){delete o.userData._moving});if(W.moveTarget===t){var pos=groundPos(e);if(pos){pos.y=t.position.y;t.position.copy(pos);W.moveTarget=null;hint('Placed!')}return}t.userData._moving=true;W.moveTarget=t;hint('Click ground to place')}
}

var ghost=null;
canvas.addEventListener('pointermove',function(e){
  if(W.mode!=='place'||!W.sel)return;
  var pos=groundPos(e);if(!pos){if(ghost){W.scene.remove(ghost);ghost=null}return}
  if(!ghost){ghost=makeObj(W.sel);ghost.traverse(function(c){if(c.material&&c.material.opacity!==undefined){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=0.3}});W.scene.add(ghost)}
  pos.y=W.sel.w?1.4:0.01;ghost.position.copy(pos);
  if(W.placeRot!==0)ghost.rotation.y=W.placeRot;
  else if(W.sel.w){var d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();ghost.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
});
canvas.addEventListener('pointermove',function(e){
  var hl=document.getElementById('hl'),hln=document.getElementById('hln'),hlp=document.getElementById('hlp'),t=findTarget();
  if(t&&t.userData&&t.userData.name){var pos=new THREE.Vector3();t.getWorldPosition(pos);pos.project(W.camera);hl.style.display='block';hl.style.left=((pos.x*0.5+0.5)*innerWidth)+'px';hl.style.top=((-pos.y*0.5+0.5)*innerHeight-40)+'px';hln.textContent=t.userData.name;hlp.textContent='$'+(t.userData.price||0).toLocaleString()}else{hl.style.display='none'}
});

var md=false,mm=false,mp={x:0,y:0};
canvas.addEventListener('pointerdown',function(e){md=true;mm=false;mp={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointermove',function(e){if(md&&(Math.abs(e.clientX-mp.x)>2||Math.abs(e.clientY-mp.y)>2))mm=true});
canvas.addEventListener('pointerup',function(e){if(!mm)handleClick(e);md=false});

document.addEventListener('keydown',function(e){
  if((e.key==='r'||e.key==='R')&&W.mode==='place'&&W.sel){e.preventDefault();W.placeRot=(W.placeRot+Math.PI/2)%(Math.PI*2);hint('↻ '+Math.round(W.placeRot*180/Math.PI)+'° — click to place '+W.sel.n)}
});

// Globals
window.switchTab=function(k){
  W.catKey=k;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.cat===k)});
  var el=document.getElementById('items');el.innerHTML='';
  W.cat[k].forEach(function(it){
    var d=document.createElement('div');d.className='it'+(W.sel&&W.sel.id===it.id?' s':'');
    d.innerHTML='<span class="swatch" style="background:'+it.sw+'"></span>'+it.i+'<div class="n">'+it.n+'</div><div class="p">$'+it.p+'</div>';
    d.onclick=function(){document.querySelectorAll('.it').forEach(function(x){x.classList.remove('s')});d.classList.add('s');W.sel=it;W.placeRot=0;if(ghost){W.scene.remove(ghost);ghost=null}hint('Selected: '+it.n+' — click ground, R to rotate')};
    el.appendChild(d);
  });
};
window.setMode=function(m){
  W.mode=m;['P','D','R','M'].forEach(function(l,i){document.getElementById('b'+l).classList.toggle('on',['place','delete','rotate','move'][i]===m)});
  W.placeRot=0;W.moveTarget=null;if(ghost){W.scene.remove(ghost);ghost=null}
  hint({place:W.sel?'Place: click ground | R=rotate '+W.sel.n:'Place: select item first',delete:'Delete: click object',rotate:'Rotate: click object to spin 90°',move:'Move: click object, then click ground'}[m]||'');
};

window.doSave=async function(){var name=document.getElementById('pnInput').value.trim()||'Untitled';var items=W.placed.map(function(o){return{id:o.userData.id,x:Math.round(o.position.x*100)/100,y:Math.round(o.position.y*100)/100,z:Math.round(o.position.z*100)/100,ry:Math.round(o.rotation.y*100)/100,price:o.userData.price}});try{var r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,items:items,total_cost:W.total,budget:W.budget-W.total})});var j=await r.json();hint(j.success?'✅ Saved!':'❌ '+(j.error||'Failed'));document.getElementById('savePop').classList.remove('show')}catch(e){hint('❌ Network error')}};

document.getElementById('bP').onclick=function(){window.setMode('place')};
document.getElementById('bD').onclick=function(){window.setMode('delete')};
document.getElementById('bR').onclick=function(){window.setMode('rotate')};
document.getElementById('bM').onclick=function(){window.setMode('move')};

window.switchTab('walls');window.setMode('place');

function resize(){var w=innerWidth,h=innerHeight;W.renderer.setSize(w,h);W.camera.aspect=w/h;W.camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);W.controls.update();W.renderer.render(W.scene,W.camera)}anim();
console.log('instaBuilt 3D Builder ready');
</script>
