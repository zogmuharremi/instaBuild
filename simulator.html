<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — 3D Builder</title>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #c{display:block;width:100%;height:100vh;cursor:crosshair}
    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
    .top .logo{font-size:13px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:4px;text-decoration:none}.top .logo em{font-style:normal;color:var(--g)}
    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}.tb.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:6px;top:50px;bottom:6px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:225px;display:flex;flex-direction:column;gap:4px}
    .side h3{font-size:9px;font-weight:700;color:var(--w)}
    .tabs{display:flex;gap:1px;margin-bottom:2px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px 1px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(46,204,113,.06)}
    .it .i{font-size:16px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6.5px;color:rgba(46,204,113,.4)}
    .it .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:2px;vertical-align:middle}
    .popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:500px;width:90%}.popup.show{display:block}.popup h3{font-size:15px;color:var(--w);margin-bottom:6px}.popup p{font-size:11px;color:var(--s);margin-bottom:10px}
    .prebox{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .pr{background:var(--n3);border:1.5px solid var(--b);border-radius:6px;padding:8px;cursor:pointer;transition:.15s}.pr:hover{border-color:var(--g)}.pr .pi{font-size:18px}.pr .pn{font-size:9px;font-weight:600;color:var(--w)}.pr .ps{font-size:7px;color:var(--s);margin-top:2px}
    .pr .layout{width:80px;height:50px;margin:6px auto 4px;position:relative;background:var(--n);border:1px solid var(--b);border-radius:3px}
    .pr .layout span{position:absolute;border-radius:1px}.pr .layout .lw{background:var(--g);opacity:.6}.pr .layout .lwin{background:#60a5fa;opacity:.7}.pr .layout .ldoor{background:#f59e0b;opacity:.7}
    #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;pointer-events:none;z-index:40;transition:opacity .3s}
    #modeI{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
    #modeI .mi{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;font-family:Inter}
    .hoverLabel{position:fixed;pointer-events:none;z-index:45;background:rgba(10,14,20,.9);border:1px solid var(--g);border-radius:6px;padding:4px 10px;font-size:10px;font-family:Inter;color:var(--w);white-space:nowrap;display:none}
    .hoverLabel .hlp{color:var(--g);font-size:9px}
    @media(max-width:700px){.side{width:185px;left:3px}}@media(max-width:500px){.side{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click canvas to lock · Pick item → click ground to place · Press R to rotate</div>
<div id="modeI"><span class="mi" style="background:var(--g);color:var(--n)" id="miMode">🔨 PLACE</span><span class="mi" style="background:var(--n3);border:1px solid var(--b);color:var(--g)" id="miItem">No item selected</span></div>
<div class="hoverLabel" id="hoverLabel"><span id="hlName"></span><br><span class="hlp" id="hlPrice"></span></div>

<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" onclick="window.toggleGrid()">📐 Grid ON</button>
  <button class="tb" onclick="window.showPrebuilds()">🏘️ Prebuilds</button>
  <button class="tb" onclick="window.doUndo()">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="budget">💰 $100,000</span>
  <button class="tb" onclick="window.saveProject()" style="color:#f59e0b;border-color:rgba(245,158,11,.3)">💾 Save</button>
  <button class="tb" onclick="window.showLoadPopup()" style="color:#60a5fa;border-color:rgba(96,165,250,.3)">📂 Load</button>
  <button class="tb red" onclick="window.doClear()">Clear</button>
</div>
<div class="side" id="side">
  <h3>📦 Catalog</h3>
  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="walls" onclick="window.switchTab('walls')">🧱</button>
    <button class="tab" data-cat="windows" onclick="window.switchTab('windows')">🪟</button>
    <button class="tab" data-cat="doors" onclick="window.switchTab('doors')">🚪</button>
    <button class="tab" data-cat="floors" onclick="window.switchTab('floors')">🟫</button>
    <button class="tab" data-cat="furniture" onclick="window.switchTab('furniture')">🛋️</button>
    <button class="tab" data-cat="kitchen" onclick="window.switchTab('kitchen')">🍳</button>
    <button class="tab" data-cat="outdoor" onclick="window.switchTab('outdoor')">🌳</button>
    <button class="tab" data-cat="roofs" onclick="window.switchTab('roofs')">🏠</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="popup" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click any home to load it — fully furnished.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" onclick="window.closePre()">Cancel</button></div></div>
<div class="popup" id="savePop"><h3>💾 Save Project</h3><p>Give your project a name.</p><input id="projectName" style="width:100%;padding:10px;background:var(--n3);border:1px solid var(--b);border-radius:6px;color:var(--w);font-size:13px;font-family:Inter;outline:none;margin-bottom:10px" placeholder="My Dream Home"><div style="display:flex;gap:8px;justify-content:center"><button class="tb" onclick="window.doSave()" style="background:var(--g);color:var(--n)">💾 Save</button><button class="tb" onclick="document.getElementById('savePop').classList.remove('show')">Cancel</button></div></div>
<div class="popup" id="loadPop"><h3>📂 Load Project</h3><div id="loadList" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px"><div style="color:var(--s);font-size:12px;text-align:center;padding:20px">Loading...</div></div><button class="tb" onclick="document.getElementById('loadPop').classList.remove('show')">Cancel</button></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = window._W = {};
W.renderer = null; W.scene = null; W.camera = null; W.controls = null; W.clock = null;
W.pMode = 'place'; W.gridOn = true; W.budget = 100000; W.sel = null; W.catKey = 'walls';
W.placeRotation = 0; W.placed = []; W.undoStack = []; W.allItems = {}; W.prebuilds = [];
W.gridH = null; W.moveTarget = null; W.ghost = null; W.ghostTarget = new THREE.Vector3();
W.mouseMoved = false; W.mouseDown = new THREE.Vector2(); W.locked = false;
W.pitch = 0; W.yaw = 0; W.keys = {};

// ─── THREE.JS INIT ───
const canvas = document.getElementById('c');
W.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
W.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
W.renderer.shadowMap.enabled = true;
W.renderer.toneMapping = THREE.ACESFilmicToneMapping;
W.renderer.toneMappingExposure = 1.1;

W.scene = new THREE.Scene();
W.scene.background = new THREE.Color('#0d1a2d');
W.scene.fog = new THREE.Fog('#0d1a2d', 25, 60);

W.camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 50);
W.camera.position.set(8, 6, 10);
W.controls = new OrbitControls(W.camera, W.renderer.domElement);
W.controls.target.set(0, 0.5, 0);
W.controls.enableDamping = true;
W.controls.dampingFactor = 0.08;
W.controls.minDistance = 2;
W.controls.maxDistance = 25;
W.controls.maxPolarAngle = Math.PI * 0.52;
W.controls.update();

W.clock = new THREE.Clock();

// Lights
W.scene.add(new THREE.AmbientLight('#c8ddf8', 0.6));
const sun = new THREE.DirectionalLight('#fffef5', 3);
sun.position.set(14, 10, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
W.scene.add(sun);
W.scene.add(new THREE.HemisphereLight('#c8ddf8', '#3a5030', 0.3));

// Grid + Ground
W.gridH = new THREE.GridHelper(40, 40, '#2ecc71', '#1a2a1e');
W.gridH.position.set(0, 0.005, 0);
W.scene.add(W.gridH);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#3a5a2a', roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
W.scene.add(ground);

// ─── MATERIALS (color-coded by functional category) ───
const M = {
  // Walls
  stuccoW:   new THREE.MeshStandardMaterial({ color: '#f0f3f7', roughness: 0.45 }),
  stuccoC:   new THREE.MeshStandardMaterial({ color: '#e8dfd2', roughness: 0.45 }),
  stuccoG:   new THREE.MeshStandardMaterial({ color: '#9ca8b4', roughness: 0.45 }),
  stuccoN:   new THREE.MeshStandardMaterial({ color: '#2a3a55', roughness: 0.45 }),
  brick:     new THREE.MeshStandardMaterial({ color: '#b05040', roughness: 0.55 }),
  brickWH:   new THREE.MeshStandardMaterial({ color: '#e8dcd0', roughness: 0.55 }),
  timber:    new THREE.MeshStandardMaterial({ color: '#c09870', roughness: 0.5 }),
  steel:     new THREE.MeshStandardMaterial({ color: '#5a6878', roughness: 0.3, metalness: 0.85 }),
  metalWall: new THREE.MeshStandardMaterial({ color: '#8899aa', roughness: 0.22, metalness: 0.55 }),
  // Seating (warm fabric tones)
  sofaCream: new THREE.MeshStandardMaterial({ color: '#e8e4dc', roughness: 0.45 }),
  sofaTaupe: new THREE.MeshStandardMaterial({ color: '#c4b8a8', roughness: 0.45 }),
  sofaNavy:  new THREE.MeshStandardMaterial({ color: '#3a4a62', roughness: 0.45 }),
  // Tables/Desks (wood browns)
  woodOak:   new THREE.MeshStandardMaterial({ color: '#c4a882', roughness: 0.5 }),
  woodWalnut:new THREE.MeshStandardMaterial({ color: '#5c3d2e', roughness: 0.45 }),
  woodCherry:new THREE.MeshStandardMaterial({ color: '#8b3a3a', roughness: 0.4 }),
  // Appliances (cool silver/black metallic)
  silver:    new THREE.MeshStandardMaterial({ color: '#c0c0c0', roughness: 0.2, metalness: 0.7 }),
  black:     new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.2 }),
  // Beds (two-tone)
  bedFrame:  new THREE.MeshStandardMaterial({ color: '#8b6f4a', roughness: 0.5 }),
  mattress:  new THREE.MeshStandardMaterial({ color: '#f5f0e8', roughness: 0.6 }),
  // Storage
  cabinet:   new THREE.MeshStandardMaterial({ color: '#6b4a2e', roughness: 0.45 }),
  // Glass
  glass:     new THREE.MeshStandardMaterial({ color: '#c8ddf8', roughness: 0.03, metalness: 0.05, transparent: true, opacity: 0.45 }),
  frosted:   new THREE.MeshStandardMaterial({ color: '#d8e4f0', roughness: 0.1, metalness: 0.03, transparent: true, opacity: 0.55 }),
  // Outdoor
  leaf:      new THREE.MeshStandardMaterial({ color: '#3d6b2e', roughness: 0.65 }),
  bark:      new THREE.MeshStandardMaterial({ color: '#6b4d3a', roughness: 0.8 }),
  bush:      new THREE.MeshStandardMaterial({ color: '#4a7a3a', roughness: 0.6 }),
  pool:      new THREE.MeshStandardMaterial({ color: '#4080c0', roughness: 0.15, metalness: 0.2 }),
  fountain:  new THREE.MeshStandardMaterial({ color: '#a0a0a0', roughness: 0.3 }),
  path:      new THREE.MeshStandardMaterial({ color: '#c0b8a8', roughness: 0.6 }),
  lantern:   new THREE.MeshStandardMaterial({ color: '#f0a030', roughness: 0.3, emissive: '#f0a030', emissiveIntensity: 0.3 }),
  // Roofs
  roofSlate: new THREE.MeshStandardMaterial({ color: '#3d4855', roughness: 0.4 }),
  roofTerra: new THREE.MeshStandardMaterial({ color: '#b55a3a', roughness: 0.4 }),
  roofMetal: new THREE.MeshStandardMaterial({ color: '#8899aa', roughness: 0.22, metalness: 0.55 }),
  roofGreen: new THREE.MeshStandardMaterial({ color: '#4a6e3e', roughness: 0.4 }),
  // Doors
  doorDark:  new THREE.MeshStandardMaterial({ color: '#2a3545', roughness: 0.2, metalness: 0.55 }),
  // Floors
  floorWood: new THREE.MeshStandardMaterial({ color: '#c4a882', roughness: 0.4 }),
  floorTile: new THREE.MeshStandardMaterial({ color: '#d0d0d0', roughness: 0.3 }),
  floorConc: new THREE.MeshStandardMaterial({ color: '#c4c8ce', roughness: 0.7 }),
  floorMarble:new THREE.MeshStandardMaterial({ color: '#e8e0d8', roughness: 0.15 }),
  floorDark: new THREE.MeshStandardMaterial({ color: '#4a2a1a', roughness: 0.4 }),
  floorGrass:new THREE.MeshStandardMaterial({ color: '#4a7a3a', roughness: 0.8 }),
  // Trim
  conc:      new THREE.MeshStandardMaterial({ color: '#c4c8ce', roughness: 0.7 }),
  rug:       new THREE.MeshStandardMaterial({ color: '#8b7355', roughness: 0.8 }),
};

// BUILD HELPERS
function box(w, h, d, mat) { const g = new THREE.BoxGeometry(w, h, d); const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function cyl(r, h, mat, segs = 8) { const g = new THREE.CylinderGeometry(r, r, h, segs); const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function sph(r, mat, segs = 6) { const g = new THREE.SphereGeometry(r, segs, 4); const m = new THREE.Mesh(g, mat); m.castShadow = true; return m; }
function grp(...children) { const g = new THREE.Group(); children.forEach(c => g.add(c)); return g; }

// ─── IMPROVED FURNITURE FACTORIES (silhouette-first, component-grouped) ───
function makeChair() {
  return grp(
    box(0.38, 0.15, 0.38, M.sofaTaupe),              // seat
    box(0.38, 0.55, 0.06, M.sofaTaupe),               // backrest (offset in position below)
    cyl(0.028, 0.38, M.woodOak),                        // leg
    cyl(0.028, 0.38, M.woodOak),                        // leg
    cyl(0.028, 0.38, M.woodOak),                        // leg
    cyl(0.028, 0.38, M.woodOak)                         // leg
  );
}
function makeSofa() {
  const g = grp(
    box(1.9, 0.15, 0.65, M.sofaCream),               // seat base
    box(1.9, 0.58, 0.08, M.sofaCream),                // backrest (tall, thin, rear)
    box(0.10, 0.35, 0.65, M.sofaCream),               // left armrest
    box(0.10, 0.35, 0.65, M.sofaCream)                // right armrest
  );
  // Position components
  g.children[1].position.set(0, 0.35, -0.3);          // backrest at rear
  g.children[2].position.set(-0.95, 0.15, 0);         // left arm
  g.children[3].position.set(0.95, 0.15, 0);          // right arm
  return g;
}
function makeTable() {
  return grp(
    box(1.5, 0.06, 0.9, M.woodOak),                  // thin top
    cyl(0.03, 0.72, M.woodOak),                        // leg
    cyl(0.03, 0.72, M.woodOak),                        // leg
    cyl(0.03, 0.72, M.woodOak),                        // leg
    cyl(0.03, 0.72, M.woodOak)                         // leg
  );
}
function makeBed() {
  const g = grp(
    box(1.65, 0.08, 2.1, M.bedFrame),                // base frame
    box(1.55, 0.22, 2.0, M.mattress),                 // mattress (lighter)
    box(1.65, 0.65, 0.06, M.bedFrame)                 // headboard (tall, one end)
  );
  g.children[1].position.set(0, 0.15, 0);              // mattress on top
  g.children[2].position.set(0, 0.35, -1.02);          // headboard at head
  return g;
}
function makeTV() {
  return grp(
    box(1.2, 0.32, 0.3, M.woodOak),                  // stand
    box(1.1, 0.02, 0.7, M.black),                     // screen (thin, dark)
    box(0.06, 0.02, 0.7, M.black)                     // bezel
  );
}
function makeBookshelf() {
  const g = grp(box(0.95, 1.6, 0.32, M.cabinet));
  // Shelf bands — thin horizontal strips
  for (let i = 0; i < 4; i++) { const s = box(0.92, 0.025, 0.30, M.woodWalnut); s.position.y = -0.65 + i * 0.45; g.add(s); }
  return g;
}
function makeDesk() {
  return grp(
    box(1.3, 0.04, 0.65, M.woodOak),                 // thin top
    cyl(0.025, 0.72, M.woodOak), cyl(0.025, 0.72, M.woodOak),
    cyl(0.025, 0.72, M.woodOak), cyl(0.025, 0.72, M.woodOak)
  );
}
function makeLamp() {
  return grp(
    cyl(0.04, 1.2, M.black),                            // pole
    cyl(0.03, 0.8, M.black),                            // upper pole
    box(0.22, 0.22, 0.22, M.lantern)                   // shade (glowing)
  );
}
function makeMirror() {
  return grp(
    box(0.65, 0.03, 1.0, M.silver),                   // mirror surface
    box(0.7, 0.04, 0.04, M.woodOak),                   // frame top
    box(0.7, 0.04, 0.04, M.woodOak)                    // frame bottom
  );
}
function makeCounter() {
  return grp(
    box(1.8, 0.45, 0.6, M.stuccoW),                   // base cabinet
    box(1.85, 0.03, 0.62, M.woodOak),                  // thin countertop
    box(0.04, 0.02, 0.5, M.silver)                     // handle strip
  );
}
function makeFridge() {
  return grp(
    box(0.7, 1.8, 0.7, M.silver),                     // tall body
    box(0.68, 0.02, 0.1, M.black),                     // handle
    box(0.68, 0.02, 0.1, M.black)                      // handle
  );
}
function makeSink() { return grp(box(0.8, 0.04, 0.5, M.silver), box(0.7, 0.02, 0.4, M.black)); }
function makeStove() { return grp(box(0.6, 0.04, 0.5, M.black), cyl(0.06, 0.015, M.silver, 6), cyl(0.06, 0.015, M.silver, 6)); }
function makeIsland() {
  return grp(
    box(1.5, 0.45, 0.85, M.stuccoW),
    box(1.55, 0.03, 0.87, M.woodOak),
    box(0.06, 0.35, 0.04, M.woodOak),
    box(0.06, 0.35, 0.04, M.woodOak)
  );
}
function makeCabinet() {
  return grp(
    box(0.9, 0.45, 0.5, M.cabinet),
    box(0.88, 0.02, 0.48, M.woodWalnut),
    box(0.03, 0.02, 0.4, M.silver)
  );
}
function makeRug() { const m = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.015, 1.6), M.rug); m.castShadow = false; m.receiveShadow = true; return m; }

// Tree helpers
function makeTree(small) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, 1.5, 8), M.bark);
  trunk.position.y = 0.75; trunk.castShadow = true;
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.0, 8), M.leaf);
  crown.position.y = 1.5; crown.castShadow = true;
  return grp(trunk, crown);
}
function makePalm() {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 2.5, 8), M.bark);
  trunk.position.y = 1.25; trunk.castShadow = true;
  const g = grp(trunk);
  for (let f = 0; f < 7; f++) {
    const fr = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.02, 0.2), new THREE.MeshStandardMaterial({ color: '#5a9a3e', roughness: 0.4, side: THREE.DoubleSide }));
    fr.position.set(0, 2.6, 0);
    fr.rotation.set(0.25 + Math.random() * 0.4, f / 7 * Math.PI * 2, Math.random() * 0.3);
    fr.castShadow = true;
    g.add(fr);
  }
  return g;
}

// ─── WALL VARIANT FACTORIES (5 types) ───

function hint(t) { document.getElementById('hint').textContent = t; }
function updCost() { document.getElementById('budget').textContent = '💰 $' + (W.budget - W.total).toLocaleString(); }
function snap(v) { return W.gridOn ? Math.round(v / 0.5) * 0.5 : v; }

// ─── GHOST PLACEMENT ───
let ghostObj = null;
function createGhost(item) { if (ghostObj) { W.scene.remove(ghostObj); } if (!item) return; const g = item.f(); g.traverse(c => { if (c.material) { c.material = c.material.clone(); c.material.transparent = true; c.material.opacity = 0.4; } }); ghostObj = g; W.scene.add(g); }
function destroyGhost() { if (ghostObj) { W.scene.remove(ghostObj); ghostObj = null; } }
function updateGhost(pos, item) {
  if (!ghostObj || !item) return;
  ghostObj.position.copy(pos);
  if (item.wall) {
    if (W.placeRotation !== 0) ghostObj.rotation.y = W.placeRotation;
    else { const d = new THREE.Vector3().subVectors(pos, W.camera.position).setY(0).normalize(); ghostObj.rotation.y = Math.round(Math.atan2(d.x, d.z) / (Math.PI / 2)) * (Math.PI / 2); }
  }
}

function getGroundPos(e) {
  const rc = new THREE.Raycaster();
  const mx = document.pointerLockElement ? 0 : (e.clientX / innerWidth) * 2 - 1;
  const my = document.pointerLockElement ? 0 : -(e.clientY / innerHeight) * 2 + 1;
  rc.setFromCamera(new THREE.Vector2(mx, my), W.camera);
  const pt = new THREE.Vector3();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = rc.ray.intersectPlane(plane, pt);
  if (!hit || Math.abs(pt.x) > 19 || Math.abs(pt.z) > 19) return null;
  return new THREE.Vector3(snap(pt.x), 0.01, snap(pt.z));
}

// ─── PLACE ───
function placeItem(e) {
  if (!W.sel || W.pMode !== 'place') return;
  // Use mouse position for placement — click on the ground
  const pos = getGroundPos(e);
  if (!pos) return; // clicked sky/off-world
  pos.y = W.sel.wall ? 1.4 : 0.01;
  const obj = W.sel.f();
  obj.position.copy(pos);
  if (W.placeRotation !== 0) obj.rotation.y = W.placeRotation;
  else if (W.sel.wall) { const ad = new THREE.Vector3().subVectors(pos, W.camera.position).setY(0).normalize(); obj.rotation.y = Math.round(Math.atan2(ad.x, ad.z) / (Math.PI / 2)) * (Math.PI / 2); }
  obj.userData = { id: W.sel.id, price: W.sel.p, name: W.sel.n, canRot: true };
  W.scene.add(obj); W.placed.push(obj); W.undoStack.push(obj);
  if (W.undoStack.length > 50) W.undoStack.shift();
  W.total += W.sel.p; W.placeRotation = 0;
  updCost(); hint('Placed: ' + W.sel.n + '  |  Budget: $' + (W.budget - W.total).toLocaleString());
}

// ─── DELETE / ROTATE / MOVE ───
function findAtCenter() {
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(0, 0), W.camera);
  const hits = rc.intersectObjects(W.placed, true);
  if (hits.length === 0) return null;
  let tgt = hits[0].object;
  while (tgt.parent && tgt.parent !== W.scene && W.placed.includes(tgt.parent)) tgt = tgt.parent;
  return W.placed.includes(tgt) ? tgt : null;
}

function doAction(e) {
  if (W.pMode === 'place') { placeItem(e); return; }
  const tgt = findAtCenter();
  if (!tgt) return;
  if (W.pMode === 'delete') { W.total -= (tgt.userData.price || 0); W.scene.remove(tgt); W.placed.splice(W.placed.indexOf(tgt), 1); updCost(); hint('Deleted'); }
  else if (W.pMode === 'rotate') { tgt.rotation.y += Math.PI / 2; hint('Rotated 90°'); }
  else if (W.pMode === 'move') { W.placed.forEach(o => delete o.userData._moving); tgt.userData._moving = true; W.moveTarget = tgt; hint('Moving: click ground to place'); }
}

// ─── HOVER LABEL ───
const hoverLabel = document.getElementById('hoverLabel');
const hoverLabelName = document.getElementById('hlName');
const hoverLabelPrice = document.getElementById('hlPrice');
function updateHoverLabel() {
  const tgt = findAtCenter();
  if (tgt && tgt.userData && tgt.userData.name) {
    const pos = new THREE.Vector3(); tgt.getWorldPosition(pos);
    const proj = pos.clone().project(W.camera);
    hoverLabel.style.display = 'block';
    hoverLabel.style.left = ((proj.x * 0.5 + 0.5) * innerWidth) + 'px';
    hoverLabel.style.top = ((-proj.y * 0.5 + 0.5) * innerHeight - 40) + 'px';
    hoverLabelName.textContent = tgt.userData.name;
    hoverLabelPrice.textContent = '$' + (tgt.userData.price || 0).toLocaleString();
  } else {
    hoverLabel.style.display = 'none';
  }
}

    const d = document.createElement('div'); d.className = 'it' + (W.sel && W.sel.id === item.id ? ' s' : '');
    d.innerHTML = '<span class="sw" style="background:' + (item.sw || '#888') + '"></span>' + item.i + '<div class="n">' + item.n + '</div><div class="p">$' + item.p + '</div>';
    d.onclick = function() { document.querySelectorAll('.it').forEach(x => x.classList.remove('s')); d.classList.add('s'); W.sel = item; W.placeRotation = 0; destroyGhost(); hint('Selected: ' + item.n + ' — click to place, R to rotate'); updateModeIndicator(); };
    el.appendChild(d);
  });
};
window.setMode = function(m) {
  W.pMode = m; ['P', 'D', 'R', 'M'].forEach((l, i) => document.getElementById('b' + l).classList.toggle('on', ['place', 'delete', 'rotate', 'move'][i] === m));
  W.placeRotation = 0; destroyGhost(); updateModeIndicator();
  hint({ place: W.sel ? 'Place: click to place ' + W.sel.n + '  |  R = rotate' : 'Place: select item first', delete: 'Delete: look at object → click', rotate: 'Rotate: look at object → click to spin 90°', move: 'Move: click object → click ground' }[m]);
};
window.toggleGrid = function() { W.gridOn = !W.gridOn; W.gridH.visible = W.gridOn; const b = document.querySelector('[onclick*="toggleGrid"]'); if (b) { b.textContent = '📐 Grid ' + (W.gridOn ? 'ON' : 'OFF'); b.classList.toggle('on', !W.gridOn); } };
window.doUndo = function() { const obj = W.undoStack.pop(); if (obj) { W.total -= (obj.userData.price || 0); W.scene.remove(obj); W.placed.splice(W.placed.indexOf(obj), 1); updCost(); hint('Undone'); } };
window.doClear = function() { if (!confirm('Clear all?')) return; W.placed.forEach(o => W.scene.remove(o)); W.placed.length = 0; W.undoStack.length = 0; W.total = 0; updCost(); hint('Cleared — $' + W.budget.toLocaleString() + ' available'); };
window.showPrebuilds = function() {
  const el = document.getElementById('preList'); el.innerHTML = '';
  W.prebuilds.forEach(pb => {
    const d = document.createElement('div'); d.className = 'pr';
    const ly = document.createElement('div'); ly.className = 'layout';
    // Mini floor plan
    ly.innerHTML = '<span class="lw" style="left:10%;top:15%;width:80%;height:12%"></span><span class="lw" style="left:10%;top:15%;width:12%;height:70%"></span><span class="lw" style="left:10%;bottom:15%;width:80%;height:12%"></span><span class="lw" style="right:10%;top:15%;width:12%;height:70%"></span><span class="lwin" style="left:25%;top:10%;width:15%;height:20%"></span><span class="lwin" style="right:40%;top:10%;width:15%;height:20%"></span><span class="ldoor" style="left:38%;bottom:10%;width:20%;height:18%"></span>';
    d.innerHTML = '<div class="pi">' + pb.i + '</div><div class="pn">' + pb.n + '</div><div class="ps">' + pb.s + '</div>';
    d.insertBefore(ly, d.firstChild);
    d.onclick = function() { window.loadPrebuild(pb); };
    el.appendChild(d);
  });
  document.getElementById('prePop').classList.add('show');
};
window.closePre = function() { document.getElementById('prePop').classList.remove('show'); };
window.loadPrebuild = function(pb) {
  W.placed.forEach(o => W.scene.remove(o)); W.placed.length = 0; W.undoStack.length = 0; W.total = 0;
  let c = 0;
  pb.items.forEach(it => {
    const found = W.allItems[it.t]; if (!found) return;
    const obj = found.f();
    obj.position.set(it.x || 0, found.wall ? 1.4 : 0.01, it.z || 0);
    if (it.ry) obj.rotation.y = it.ry;
    obj.userData = { id: found.id, price: found.p, name: found.n, canRot: true };
    W.scene.add(obj); W.placed.push(obj); W.total += found.p; c++;
  });
  updCost(); hint('Loaded: ' + pb.n + ' (' + c + ' items)');
  document.getElementById('prePop').classList.remove('show');
};

// ─── SAVE/LOAD ───
const API = window.location.origin;
window.saveProject = function() { document.getElementById('savePop').classList.add('show'); document.getElementById('projectName').focus(); };
window.doSave = async function() {
  const name = document.getElementById('projectName').value.trim() || 'Untitled';
  const items = W.placed.map(o => ({ id: o.userData.id, x: Math.round(o.position.x * 100) / 100, y: Math.round(o.position.y * 100) / 100, z: Math.round(o.position.z * 100) / 100, ry: Math.round(o.rotation.y * 100) / 100, price: o.userData.price }));
  const btn = document.querySelector('#savePop .tb');
  btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    const r = await fetch(API + '/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, items, total_cost: W.total, budget: W.budget - W.total }) });
    const j = await r.json();
    hint(j.success ? '✅ Saved! id: ' + j.project_id : '❌ ' + (j.error || 'Failed'));
    document.getElementById('savePop').classList.remove('show');
  } catch (e) { hint('❌ Network error — Flask server running?'); }
  btn.textContent = '💾 Save'; btn.disabled = false;
};
window.showLoadPopup = async function() {
  document.getElementById('loadPop').classList.add('show');
  const list = document.getElementById('loadList');
  list.innerHTML = '<div style="color:var(--s);font-size:12px;text-align:center;padding:20px">Loading...</div>';
  try {
    const r = await fetch(API + '/api/projects'); const j = await r.json();
    if (!j.success || !j.projects.length) { list.innerHTML = '<div style="color:var(--s);font-size:12px;text-align:center;padding:20px">No saved projects</div>'; return; }
    list.innerHTML = '';
    j.projects.forEach(p => {
      const d = document.createElement('div'); d.style.cssText = 'background:var(--n3);border:1px solid var(--b);border-radius:6px;padding:10px;display:flex;justify-content:space-between;align-items:center';
      d.innerHTML = '<div><div style="font-weight:600;color:var(--w);font-size:12px">' + p.name + '</div><div style="font-size:10px;color:var(--s)">$' + (p.total_cost || 0).toLocaleString() + ' · ' + (p.updated_at || p.created_at || '').slice(0, 10) + '</div></div>';
      const btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:4px';
      const lb = document.createElement('button'); lb.className = 'tb'; lb.style.background = 'var(--g)'; lb.style.borderColor = 'var(--g)'; lb.style.color = 'var(--n)'; lb.textContent = 'Load';
      lb.onclick = async function() {
        const lr = await fetch(API + '/api/projects/' + p.id); const lj = await lr.json();
        if (!lj.success) return hint('❌ Load failed');
        W.placed.forEach(o => W.scene.remove(o)); W.placed.length = 0; W.undoStack.length = 0; W.total = 0;
        const proj = lj.project;
        W.budget = proj.budget ? (proj.budget + (proj.total_cost || 0)) : 100000;
        let c = 0;
        proj.items.forEach(it => {
          const found = W.allItems[it.id]; if (!found) return;
          const obj = found.f(); obj.position.set(it.x || 0, it.y || 0.01, it.z || 0);
          if (it.ry) obj.rotation.y = it.ry;
          obj.userData = { id: found.id, price: found.p, name: found.n, canRot: true };
          W.scene.add(obj); W.placed.push(obj); W.total += found.p; c++;
        });
        updCost(); hint('✅ Loaded: ' + proj.name + ' (' + c + ' items)');
        document.getElementById('loadPop').classList.remove('show');
      };
      const db = document.createElement('button'); db.className = 'tb red'; db.textContent = '✕';
      db.onclick = async function() { if (!confirm('Delete?')) return; await fetch(API + '/api/projects/' + p.id, { method: 'DELETE' }); d.remove(); };
      btns.appendChild(lb); btns.appendChild(db); d.appendChild(btns); list.appendChild(d);
    });
  } catch (e) { list.innerHTML = '<div style="color:#f85149;font-size:12px;text-align:center;padding:20px">❌ Network error</div>'; }
};

// ─── KEYBOARD ───
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    if (W.pMode === 'place' && W.sel) {
      e.preventDefault();
      W.placeRotation = (W.placeRotation + Math.PI / 2) % (Math.PI * 2);
      const deg = Math.round(W.placeRotation * 180 / Math.PI);
      hint('↻ ' + deg + '° — click to place ' + W.sel.n);
      updateModeIndicator();
    }
  }
});

// ─── TOOLBAR HOOKS ───
document.getElementById('bP').onclick = () => window.setMode('place');
document.getElementById('bD').onclick = () => window.setMode('delete');
document.getElementById('bR').onclick = () => window.setMode('rotate');
document.getElementById('bM').onclick = () => window.setMode('move');

// ─── CANVAS CLICK ───
canvas.addEventListener('pointerdown', e => { W.mouseDown.set(e.clientX, e.clientY); W.mouseMoved = false; });
canvas.addEventListener('pointermove', e => {
  if (Math.abs(e.clientX - W.mouseDown.x) > 2 || Math.abs(e.clientY - W.mouseDown.y) > 2) W.mouseMoved = true;
  if (W.pMode === 'place' && W.sel && !W.mouseMoved) {
    const pos = getGroundPos(e);
    if (pos) {
      if (!ghostObj) createGhost(W.sel);
      const gp = pos.clone(); gp.y = W.sel.wall ? 1.4 : 0.01;
      updateGhost(gp, W.sel);
    } else { destroyGhost(); }
  }
});
canvas.addEventListener('pointerup', e => { if (!W.mouseMoved) doAction(e); });

// Move click for move mode
canvas.addEventListener('click', e => {
  if (W.pMode === 'move' && W.moveTarget) {
    const pos = getGroundPos(e);
    if (pos) { pos.y = W.moveTarget.position.y; W.moveTarget.position.copy(pos); W.moveTarget.userData._moving = false; W.moveTarget = null; hint('Moved!'); }
  }
});

// ─── INIT ───
window.switchTab('walls');
window.setMode('place');

// ─── RESIZE + ANIMATE ───
function resize() { const w = innerWidth, h = innerHeight; W.renderer.setSize(w, h); W.camera.aspect = w / h; W.camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
function anim() {
  requestAnimationFrame(anim);
  W.controls.update();
  updateHoverLabel();
  W.renderer.render(W.scene, W.camera);
}
anim();
</script>
</body>
</html>
