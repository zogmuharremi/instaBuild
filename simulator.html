<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — 3D Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #c{display:block;width:100%;height:100vh}
    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
    .top .logo{font-size:13px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:4px;text-decoration:none}.top .logo em{font-style:normal;color:var(--g)}
    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .tbd{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25);color:#f85149}.tbd:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:4px;top:48px;bottom:4px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:220px}
    .side h3{font-size:9px;font-weight:700;color:var(--w);margin-bottom:3px}
    .tabs{display:flex;gap:1px;margin-bottom:4px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(46,204,113,.06)}
    .it .i{font-size:14px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6px;color:rgba(46,204,113,.4)}
    .prebox{display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .pr{background:var(--n3);border:1.5px solid var(--b);border-radius:5px;padding:4px;cursor:pointer;transition:.15s}.pr:hover{border-color:var(--g)}.pr .pi{font-size:16px}.pr .pn{font-size:8px;font-weight:600;color:var(--w)}.pr .ps{font-size:7px;color:var(--s)}
    .pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:480px;width:90%}.pop.on{display:block}.pop h3{font-size:15px;color:var(--w);margin-bottom:6px}.pop p{font-size:11px;color:var(--s);margin-bottom:10px}
    #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.12);font-size:10px;pointer-events:none;z-index:40}
    @media(max-width:700px){.side{width:180px;left:2px}}@media(max-width:500px){.side{display:none}.top{padding:4px 8px}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click canvas to lock · WASD walk · Mouse look · Space↑ Shift↓ · Pick item → click to place</div>
<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" id="bG">📐 Grid:ON</button>
  <button class="tb" id="bPre">🏘️ Prebuilds</button>
  <button class="tb" id="bUndo">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="total">$0</span>
  <button class="tb tbd" id="bClr">Clear</button>
</div>
<div class="side" id="side">
  <h3>📦 Catalog</h3>
  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="walls">🧱</button><button class="tab" data-cat="windows">🪟</button><button class="tab" data-cat="doors">🚪</button><button class="tab" data-cat="floors">🟫</button><button class="tab" data-cat="furniture">🛋️</button><button class="tab" data-cat="kitchen">🍳</button><button class="tab" data-cat="outdoor">🌳</button><button class="tab" data-cat="roofs">🏠</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="pop" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click to load — fully furnished.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" id="bClosePre">Cancel</button></div></div>

let sel=null,catKey='walls';
const placed=[],undoStack=[];

// ─── RENDER CATALOG ───
function renderCat(){
  const el=document.getElementById('grid');el.innerHTML='';
  cat[catKey].forEach(item=>{
    const d=document.createElement('div');d.className='it'+(sel&&sel.id===item.id?' s':'');
    d.innerHTML='<div class="i">'+item.i+'</div><div class="n">'+item.n+'</div><div class="p">$'+item.p+'</div>';
    d.onclick=function(){document.querySelectorAll('.it').forEach(x=>x.classList.remove('s'));d.classList.add('s');sel=item;hint('Selected: '+item.n+' — Click ground to place')};
    el.appendChild(d);
  });
}
renderCat();
document.querySelectorAll('.tab').forEach(t=>{t.onclick=function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));this.classList.add('on');catKey=this.dataset.cat;renderCat()}});

function snap(v){return gridOn?Math.round(v/.5)*.5:v}
function hint(t){document.getElementById('hint').textContent=t}
function updateCost(){document.getElementById('total').textContent='$'+total.toLocaleString()}

// ─── MAKE OBJECT ───
function makeObj(item){
  if(item.tree){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=.7;t.castShadow=true;g.add(t);const cr=new THREE.Mesh(new THREE.ConeGeometry(.65,.85,8),M.leaf);cr.position.y=1.4;cr.castShadow=true;g.add(cr);return g}
  if(item.palm){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=1.2;t.castShadow=true;g.add(t);for(let f=0;f<6;f++){const fr=new THREE.Mesh(new THREE.BoxGeometry(.75,.02,.2),new THREE.MeshStandardMaterial({color:'#5a9a3e',roughness:.4,side:THREE.DoubleSide}));fr.position.set(0,2.5,0);fr.rotation.set(.3+Math.random()*.4,f/6*Math.PI*2,Math.random()*.3);fr.castShadow=true;g.add(fr)}return g}
  if(item.pitched){const g=new THREE.Group();const p1=new THREE.Mesh(item.g(),item.m());p1.position.set(0,.28,-.65);p1.rotation.x=-.6;p1.castShadow=true;g.add(p1);const p2=new THREE.Mesh(item.g(),item.m());p2.position.set(0,.28,.65);p2.rotation.x=.6;p2.castShadow=true;g.add(p2);return g}
  const obj=new THREE.Mesh(item.g(),item.m());obj.castShadow=true;obj.receiveShadow=true;return obj
}

// ─── PLACE OBJECT ───
function getPlacePos(){
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);
  const d=rc.ray.direction.clone(),o=rc.ray.origin.clone();
  if(d.y>=0)return null; // looking up
  const t=-o.y/d.y;
  return new THREE.Vector3(snap(o.x+d.x*t),.01,snap(o.z+d.z*t));
}

function handleClick(e){
  if(!locked||pMode!=='place'||!sel)return;
  const pos=getPlacePos();if(!pos||Math.abs(pos.x)>19||Math.abs(pos.z)>19)return;
  const obj=makeObj(sel);
  pos.y=sel.wall?1.4:.01;
  obj.position.copy(pos);
  if(sel.wall)obj.rotation.y=Math.round(cam.rotation.y/(Math.PI/2))*(Math.PI/2);
  obj.userData={id:sel.id,price:sel.p,canRot:true};
  S.add(obj);placed.push(obj);
  undoStack.push(obj);if(undoStack.length>50)undoStack.shift();
  total+=sel.p;updateCost();
}

// ─── DELETE / ROTATE / MOVE ───
canvas.addEventListener('dblclick',function(e){
  if(!locked||pMode==='place')return;
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);
  const hits=rc.intersectObjects(placed,true);
  if(hits.length===0){
    // If in move mode and an object is being moved, place it
    if(pMode==='move'){const mo=placed.find(o=>o.userData._moving);if(mo){const pos=getPlacePos();if(pos){mo.position.set(pos.x,mo.position.y,pos.z);mo.userData._moving=false;hint('Moved! Double-click another to move')}}}
    return;
  }
  let tgt=hits[0].object;
  while(tgt.parent&&tgt.parent!==S&&placed.includes(tgt.parent))tgt=tgt.parent;
  if(!placed.includes(tgt))return;

  if(pMode==='delete'){
    total-=(tgt.userData.price||0);
    S.remove(tgt);placed.splice(placed.indexOf(tgt),1);
    updateCost();hint('Deleted');
  }else if(pMode==='rotate'){
    tgt.rotation.y+=Math.PI/2;hint('Rotated 90°');
  }else if(pMode==='move'){
    placed.forEach(o=>delete o.userData._moving);
    tgt.userData._moving=true;hint('Moving: click ground to place, or double-click to cancel');
  }
});

// ─── TOOLBAR ───
function setMode(m){
  pMode=m;
  ['bP','bD','bR','bM'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',['place','delete','rotate','move'][i]===m));
  const hints={place:sel?'Place: click ground to place '+sel.n:'Place: select item from catalog first',delete:'Delete: double-click objects',rotate:'Rotate: double-click to spin 90°',move:'Move: double-click object, then click new spot'};
  hint(hints[m]||'');
}
document.getElementById('bP').onclick=()=>setMode('place');
document.getElementById('bD').onclick=()=>setMode('delete');
document.getElementById('bR').onclick=()=>setMode('rotate');
document.getElementById('bM').onclick=()=>setMode('move');
document.getElementById('bG').onclick=function(){gridOn=!gridOn;gridH.visible=gridOn;this.textContent='📐 Grid:'+(gridOn?'ON':'OFF');this.classList.toggle('on',!gridOn)};
document.getElementById('bUndo').onclick=function(){const obj=undoStack.pop();if(obj){total-=(obj.userData.price||0);S.remove(obj);placed.splice(placed.indexOf(obj),1);updateCost();hint('Undone')}};
document.getElementById('bClr').onclick=function(){if(!confirm('Clear everything?'))return;placed.forEach(o=>S.remove(o));placed.length=0;undoStack.length=0;total=0;updateCost();hint('Cleared')};
// Prebuilds
document.getElementById('bPre').onclick=function(){
  const el=document.getElementById('preList');el.innerHTML='';
  prebuilds.forEach(pb=>{const d=document.createElement('div');d.className='pr';d.innerHTML='<div class="pi">'+pb.i+'</div><div class="pn">'+pb.n+'</div><div class="ps">'+pb.s+'</div>';d.onclick=function(){loadPrebuild(pb)};el.appendChild(d)});
  document.getElementById('prePop').classList.add('on');
};
document.getElementById('bClosePre').onclick=function(){document.getElementById('prePop').classList.remove('on')};

function loadPrebuild(pb){
  placed.forEach(o=>S.remove(o));placed.length=0;undoStack.length=0;total=0;
  pb.items.forEach(it=>{
    const found=allItems[it.t];if(!found){console.warn('Missing item:',it.t);return}
    const obj=makeObj(found);
    obj.position.set(it.x||0,found.wall?1.4:.01,it.z||0);
    if(it.ry)obj.rotation.y=it.ry;
    obj.userData={id:found.id,price:found.p,canRot:true};
    S.add(obj);placed.push(obj);total+=found.p;
  });
  updateCost();hint('Prebuild loaded! '+pb.n);
  document.getElementById('prePop').classList.remove('on');
}

// ─── RESIZE + ANIMATE ───
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);const dt=Math.min(clk.getDelta(),.1),s=7*dt;
  if(locked){const d=new THREE.Vector3();cam.getWorldDirection(d);d.y=0;d.normalize();const r=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0)).normalize();if(keys.w)cam.position.addScaledVector(d,s);if(keys.s)cam.position.addScaledVector(d,-s);if(keys.a)cam.position.addScaledVector(r,-s);if(keys.d)cam.position.addScaledVector(r,s);if(keys[' '])cam.position.y+=s;if(keys.shift)cam.position.y-=s;cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch}
  R.render(S,cam)}anim();
