<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — 3D Builder</title>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    canvas{display:block;width:100%;height:100vh;cursor:crosshair}
    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:5px 10px;display:flex;align-items:center;justify-content:space-between;gap:3px;flex-wrap:wrap}
    .top .logo{font-size:13px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:4px;text-decoration:none}.top .logo em{font-style:normal;color:var(--g)}
    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}.tb.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:4px;top:48px;bottom:4px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:220px;display:flex;flex-direction:column;gap:3px}
    .side h3{font-size:9px;font-weight:700;color:var(--w)}
    .tabs{display:flex;gap:1px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px 1px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .items{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(46,204,113,.06)}
    .it .i{font-size:14px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6px;color:rgba(46,204,113,.4)}
    .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;vertical-align:middle;border:1px solid rgba(255,255,255,.1)}
    .prebox{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .pr{background:var(--n3);border:1.5px solid var(--b);border-radius:6px;padding:8px;cursor:pointer;transition:.15s}.pr:hover{border-color:var(--g)}.pr .pi{font-size:18px}.pr .pn{font-size:9px;font-weight:600;color:var(--w)}.pr .ps{font-size:7px;color:var(--s)}
    .pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:500px;width:90%}.pop.show{display:block}.pop h3{font-size:15px;color:var(--w);margin-bottom:6px}.pop p{font-size:11px;color:var(--s);margin-bottom:10px}
    #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;pointer-events:none;z-index:40}
    .hl{position:fixed;pointer-events:none;z-index:45;background:rgba(10,14,20,.9);border:1px solid var(--g);border-radius:6px;padding:4px 10px;font-size:10px;font-family:Inter;color:var(--w);white-space:nowrap;display:none}.hl .hlp{color:var(--g);font-size:9px}
    @media(max-width:700px){.side{width:180px;left:2px}}@media(max-width:500px){.side{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Pick item from catalog → click ground to place · R to rotate · Scroll to zoom</div>
<div class="hl" id="hl"><span id="hln"></span><br><span class="hlp" id="hlp"></span></div>

<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" onclick="toggleGrid()">📐 Grid ON</button>
  <button class="tb" onclick="showPre()">🏘️ Prebuilds</button>
  <button class="tb" onclick="doUndo()">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="budget">💰 $100,000</span>
  <button class="tb" onclick="showSave()" style="color:#f59e0b;border-color:rgba(245,158,11,.3)">💾 Save</button>
  <button class="tb" onclick="showLoad()" style="color:#60a5fa;border-color:rgba(96,165,250,.3)">📂 Load</button>
  <button class="tb red" onclick="doClear()">Clear</button>
</div>
<div class="side">
  <h3>📦 Catalog</h3>
  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="walls" onclick="window.switchTab('walls')">🧱</button>
    <button class="tab" data-cat="windows" onclick="window.switchTab('windows')">🪟</button>
    <button class="tab" data-cat="doors" onclick="window.switchTab('doors')">🚪</button>
    <button class="tab" data-cat="floors" onclick="window.switchTab('floors')">🟫</button>
    <button class="tab" data-cat="furniture" onclick="window.switchTab('furniture')">🛋️</button>
    <button class="tab" data-cat="kitchen" onclick="window.switchTab('kitchen')">🍳</button>
    <button class="tab" data-cat="outdoor" onclick="window.switchTab('outdoor')">🌳</button>
    <button class="tab" data-cat="roofs" onclick="window.switchTab('roofs')">🏠</button>
  </div>
  <div class="items" id="items"></div>
</div>
<div class="pop" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click to load — fully furnished.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" onclick="document.getElementById('prePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="savePop"><h3>💾 Save Project</h3><input id="pnInput" style="width:100%;padding:10px;background:var(--n3);border:1px solid var(--b);border-radius:6px;color:var(--w);font-size:13px;font-family:Inter;outline:none;margin-bottom:10px" placeholder="My Dream Home"><button class="tb" onclick="doSave()" style="background:var(--g);color:var(--n);width:100%">💾 Save to Cloud</button><div style="margin-top:6px"><button class="tb" onclick="document.getElementById('savePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="loadPop"><h3>📂 Load Project</h3><div id="loadList" style="max-height:300px;overflow-y:auto"><div style="color:var(--s);font-size:12px;text-align:center;padding:20px">Loading...</div></div><div style="margin-top:10px"><button class="tb" onclick="document.getElementById('loadPop').classList.remove('show')">Cancel</button></div></div>

<script type="module">
import*as THREE from'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';

// ─── STATE ───
const W=window._W={};
W.scene=null;W.camera=null;W.controls=null;W.renderer=null;W.clock=null;
W.mode='place';W.gridOn=true;W.budget=100000;W.sel=null;W.catKey='walls';
W.placeRot=0;W.placed=[];W.undoStack=[];W.allItems={};W.prebuilds=[];
W.moveTarget=null;W.ghost=null;W.ghostTarget=new THREE.Vector3();

// ─── THREE INIT ───
const canvas=document.getElementById('c');
W.renderer=new THREE.WebGLRenderer({canvas,antialias:true});W.renderer.setPixelRatio(Math.min(devicePixelRatio,2));W.renderer.shadowMap.enabled=true;W.renderer.toneMapping=THREE.ACESFilmicToneMapping;W.renderer.toneMappingExposure=1.1;
W.scene=new THREE.Scene();W.scene.background=new THREE.Color('#0d1a2d');W.scene.fog=new THREE.Fog('#0d1a2d',25,60);
W.camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,50);W.camera.position.set(8,6,10);
W.controls=new OrbitControls(W.camera,W.renderer.domElement);W.controls.target.set(0,.5,0);W.controls.enableDamping=true;W.controls.dampingFactor=.08;W.controls.minDistance=2;W.controls.maxDistance=25;W.controls.maxPolarAngle=Math.PI*.52;W.controls.update();
W.clock=new THREE.Clock();
W.scene.add(new THREE.AmbientLight('#c8ddf8',.6));
const sun=new THREE.DirectionalLight('#fffef5',3);sun.position.set(14,10,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;W.scene.add(sun);
W.scene.add(new THREE.HemisphereLight('#c8ddf8','#3a5030',.3));
W.gridH=new THREE.GridHelper(40,40,'#2ecc71','#1a2a1e');W.gridH.position.set(0,.005,0);W.scene.add(W.gridH);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:'#3a5a2a',roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;W.scene.add(ground);

// ─── MATERIALS ───
const M={};
const mm=(n,o)=>{M[n]=new THREE.MeshStandardMaterial(o)};
mm('steel',{color:'#5a6878',roughness:.3,metalness:.85});mm('glass',{color:'#c8ddf8',roughness:.03,metalness:.05,transparent:true,opacity:.45});mm('wood',{color:'#c09870',roughness:.5});mm('brick',{color:'#b05040',roughness:.55});mm('white',{color:'#f0f3f7',roughness:.45});mm('beige',{color:'#e8dfd2',roughness:.45});mm('gray',{color:'#9ca8b4',roughness:.45});mm('navy',{color:'#2a3a55',roughness:.45});mm('metalW',{color:'#8899aa',roughness:.22,metalness:.55});mm('door',{color:'#2a3545',roughness:.2,metalness:.55});mm('silver',{color:'#c0c0c0',roughness:.2,metalness:.7});mm('black',{color:'#1a1a1a',roughness:.2});mm('oak',{color:'#c4a882',roughness:.5});mm('walnut',{color:'#5c3d2e',roughness:.45});mm('cherry',{color:'#8b3a3a',roughness:.4});mm('cabinet',{color:'#6b4a2e',roughness:.45});mm('sofaC',{color:'#e8e4dc',roughness:.45});mm('sofaT',{color:'#c4b8a8',roughness:.45});mm('mattress',{color:'#f5f0e8',roughness:.6});mm('bedFrame',{color:'#8b6f4a',roughness:.5});mm('leaf',{color:'#3d6b2e',roughness:.65});mm('bark',{color:'#6b4d3a',roughness:.8});mm('bush',{color:'#4a7a3a',roughness:.6});mm('pool',{color:'#4080c0',roughness:.15,metalness:.2});mm('fountain',{color:'#a0a0a0',roughness:.3});mm('path',{color:'#c0b8a8',roughness:.6});mm('lantern',{color:'#f0a030',roughness:.3,emissive:'#f0a030',emissiveIntensity:.3});mm('roof',{color:'#3d4855',roughness:.4});mm('roofTerra',{color:'#b55a3a',roughness:.4});mm('roofMetal',{color:'#8899aa',roughness:.22,metalness:.55});mm('roofGreen',{color:'#4a6e3e',roughness:.4});mm('conc',{color:'#c4c8ce',roughness:.7});mm('rug',{color:'#8b7355',roughness:.8});mm('tile',{color:'#d0d0d0',roughness:.3});mm('marble',{color:'#e8e0d8',roughness:.15});mm('darkW',{color:'#4a2a1a',roughness:.4});mm('grass',{color:'#4a7a3a',roughness:.8});

// ─── HELPERS ───
function b(w,h,d,m){const g=new THREE.BoxGeometry(w,h,d);const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o}
function cyl(r,h,m,s=8){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m)}
function sph(r,m,s=6){const o=new THREE.Mesh(new THREE.SphereGeometry(r,s,4),m);o.castShadow=true;return o}
function G(...c){const g=new THREE.Group();c.forEach(x=>g.add(x));return g}
function set(g,x,y,z,ry=0){g.position.set(x||0,y||0,z||0);g.rotation.y=ry;return g}

// ─── FURNITURE FACTORIES (every model, no exceptions) ───
function fSofa(){const g=G(b(1.9,.45,.65,M.sofaC),b(1.9,.55,.08,M.sofaC),b(.08,.32,.65,M.sofaC),b(.08,.32,.65,M.sofaC));g.children[1].position.set(0,.48,-.3);g.children[2].position.set(-.95,.16,0);g.children[3].position.set(.95,.16,0);return g}
function fChair(){const g=G(b(.36,.12,.36,M.sofaT),b(.36,.52,.05,M.sofaT),cyl(.025,.38,M.oak),cyl(.025,.38,M.oak),cyl(.025,.38,M.oak),cyl(.025,.38,M.oak));g.children[1].position.set(0,.3,-.15);g.children[2].position.set(-.15,-.2,-.15);g.children[3].position.set(.15,-.2,-.15);g.children[4].position.set(-.15,-.2,.15);g.children[5].position.set(.15,-.2,.15);return g}
function fTable(){const g=G(b(1.4,.04,.9,M.oak),cyl(.025,.7,M.oak),cyl(.025,.7,M.oak),cyl(.025,.7,M.oak),cyl(.025,.7,M.oak));g.children[1].position.set(-.65,-.36,-.42);g.children[2].position.set(.65,-.36,-.42);g.children[3].position.set(-.65,-.36,.42);g.children[4].position.set(.65,-.36,.42);return g}
function fBed(){const g=G(b(1.6,.06,2.1,M.bedFrame),b(1.5,.22,2,M.mattress),b(1.6,.6,.06,M.bedFrame));g.children[1].position.set(0,.14,0);g.children[2].position.set(0,.34,-1.02);return g}
function fTV(){const g=G(b(1.1,.28,.25,M.oak),b(1.05,.02,.65,M.black),b(.04,.02,.65,M.black));g.children[1].position.set(0,.14,.1);g.children[2].position.set(-.52,.14,.1);return g}
function fShelf(){const g=G(b(.9,1.5,.3,M.cabinet));for(let i=0;i<4;i++){const s=b(.88,.02,.28,M.walnut);s.position.y=-.6+i*.45;g.add(s)}return g}
function fDesk(){const g=G(b(1.2,.03,.6,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak));g.children[1].position.set(-.55,-.36,-.27);g.children[2].position.set(.55,-.36,-.27);g.children[3].position.set(-.55,-.36,.27);g.children[4].position.set(.55,-.36,.27);return g}
function fLamp(){return G(cyl(.035,1.1,M.black),cyl(.03,.7,M.black),b(.18,.18,.18,M.lantern))}
function fMirror(){return G(b(.6,.02,.9,M.silver),b(.64,.03,.03,M.oak),b(.64,.03,.03,M.oak))}
function fCounter(){const g=G(b(1.8,.4,.6,M.white),b(1.84,.025,.62,M.oak),b(.03,.02,.45,M.silver));g.children[1].position.set(0,.2,0);g.children[2].position.set(0,.15,.29);return g}
function fFridge(){const g=G(b(.65,1.7,.65,M.silver),b(.63,.02,.08,M.black),b(.63,.02,.08,M.black));g.children[1].position.set(0,.5,.32);g.children[2].position.set(0,-.3,.32);return g}
function fSink(){return G(b(.75,.03,.45,M.silver),b(.65,.015,.35,M.black))}
function fStove(){const g=G(b(.55,.03,.45,M.black));g.add(set(cyl(.05,.01,M.silver,6),.15,.02,-.18));g.add(set(cyl(.05,.01,M.silver,6),-.15,.02,-.18));g.add(set(cyl(.05,.01,M.silver,6),.15,.02,.18));g.add(set(cyl(.05,.01,M.silver,6),-.15,.02,.18));return g}
function fIsland(){const g=G(b(1.4,.4,.8,M.white),b(1.44,.025,.82,M.oak),b(.05,.3,.03,M.oak),b(.05,.3,.03,M.oak));g.children[1].position.set(0,.2,0);g.children[2].position.set(-.65,.15,.39);g.children[3].position.set(.65,.15,.39);return g}
function fCabinet(){return G(b(.85,.4,.45,M.cabinet),b(.83,.02,.43,M.walnut),b(.025,.02,.38,M.silver))}
function fRug(){const r=new THREE.Mesh(new THREE.BoxGeometry(2,.01,1.5),M.rug);r.castShadow=false;r.receiveShadow=true;return r}
function fTree(s){const g=G(cyl(.06*s,.1*s,1.4*s,M.bark,8),new THREE.Mesh(new THREE.ConeGeometry(.65*s,.8*s,8),M.leaf));g.children[0].position.y=.7*s;g.children[1].position.y=1.3*s;g.children[1].castShadow=true;return g}
function fPalm(){const g=G(cyl(.09,.16,2.3,M.bark,8));for(let f=0;f<7;f++){const fr=new THREE.Mesh(new THREE.BoxGeometry(.7,.015,.18),new THREE.MeshStandardMaterial({color:'#5a9a3e',roughness:.4,side:THREE.DoubleSide}));fr.position.set(0,2.4,0);fr.rotation.set(.2+Math.random()*.4,f/7*Math.PI*2,Math.random()*.3);fr.castShadow=true;g.add(fr)}return g}
function fFountain(){return G(cyl(.45,.25,M.fountain,14),cyl(.2,.45,M.fountain,14),cyl(.08,1.1,M.fountain,8))}
function fPool(){return b(1,.04,1,M.pool)}
function fFence(){return G(b(.95,.65,.035,M.oak),b(1,.025,.05,M.oak))}
function fPath(){return b(.5,.025,.7,M.path)}
function fBench(){return G(b(1.4,.06,.3,M.oak),cyl(.02,.35,M.oak),cyl(.02,.35,M.oak))}
function fLantern(){return G(cyl(.025,.9,M.black),cyl(.1,.35,M.lantern,8))}
function fMailbox(){return G(cyl(.025,.7,M.black),b(.16,.3,.16,M.black))}

// Wall variants
function fWallStd(m){const g=G(b(2,2.8,.1,m),b(2.02,.05,.12,M.cabinet),b(2.02,.04,.13,M.white));g.children[1].position.y=-1.37;g.children[2].position.y=1.38;return g}
function fWallHalf(m){const g=G(b(2,1.4,.1,m),b(2.02,.04,.13,M.oak));g.children[1].position.y=.68;return g}
function fWallGlass(t){const g=G(b(2,2.8,.055,M.steel),b(1.88,2.68,.02,t||M.glass));g.children[1].castShadow=false;for(let i of[-1,1]){const m1=b(.025,2.68,.07,M.steel);m1.position.x=i*.47;g.add(m1)}for(let i=-1;i<=1;i+=2){const m2=b(1.88,.025,.07,M.steel);m2.position.y=i*.85;g.add(m2)}return g}
function fGarden(m){const g=G(b(2,1,.14,m),b(2.04,.05,.16,M.conc));g.children[1].position.y=.48;return g}
function fColumn(m){return G(b(.14,2.9,.14,m),b(.2,.06,.2,M.conc),b(.2,.06,.2,M.conc))}
function fFlatRoof(){return b(3,.07,3,M.roof)}
function fPitchRoof(m){const g=G(b(3,.07,3,m),b(3,.07,3,m));g.children[0].position.set(0,.25,-.65);g.children[0].rotation.x=-.55;g.children[1].position.set(0,.25,.65);g.children[1].rotation.x=.55;return g}

// ─── CATALOG (every item uses f() — no simple boxes) ───
W.cat={
  walls:[
    {id:'w_white',n:'White Wall',p:200,fn:'fWallStd',sw:'#f0f3f7',w:true,mArg:M.white},
    {id:'w_brick',n:'Brick Wall',p:350,fn:'fWallStd',sw:'#b05040',w:true,mArg:M.brick},
    {id:'w_timber',n:'Timber Wall',p:400,fn:'fWallStd',sw:'#c09870',w:true,mArg:M.wood},
    {id:'w_beige',n:'Beige Wall',p:250,fn:'fWallStd',sw:'#e8dfd2',w:true,mArg:M.beige},
    {id:'w_gray',n:'Gray Wall',p:220,fn:'fWallStd',sw:'#9ca8b4',w:true,mArg:M.gray},
    {id:'w_navy',n:'Navy Wall',p:300,fn:'fWallStd',sw:'#2a3a55',w:true,mArg:M.navy},
    {id:'w_metal',n:'Metal Wall',p:500,fn:'fWallStd',sw:'#8899aa',w:true,mArg:M.metalW},
    {id:'w_half',n:'Half Wall 1.4m',p:150,fn:'fWallHalf',sw:'#f0f3f7',w:true,mArg:M.white},
    {id:'w_glass',n:'Glass Panel',p:600,fn:'fWallGlass',sw:'#c8ddf8',w:true,mArg:M.glass},
    {id:'w_frost',n:'Frosted Glass',p:650,fn:'fWallGlass',sw:'#d8e4f0',w:true,mArg:new THREE.MeshStandardMaterial({color:'#d8e4f0',roughness:.1,transparent:true,opacity:.55})},
    {id:'w_garden',n:'Garden Wall 1m',p:120,fn:'fGarden',sw:'#b05040',w:true,mArg:M.brick},
    {id:'col_steel',n:'Steel Column',p:300,fn:'fColumn',sw:'#5a6878',w:true,mArg:M.steel},
    {id:'col_wood',n:'Wood Column',p:250,fn:'fColumn',sw:'#c09870',w:true,mArg:M.wood},
  ],
  windows:[
    {id:'win_s',n:'Small Window',p:500,fn:'b',sw:'#c8ddf8',a:[1,.9,.05,M.glass]},

// ─── FUNCTIONS ───
function hint(t){document.getElementById('hint').textContent=t}
function updB(){document.getElementById('budget').textContent='💰 $'+(W.budget-W.total).toLocaleString()}
function snap(v){return W.gridOn?Math.round(v/.5)*.5:v}

// Get ground position from event (works with or without pointer lock)
function groundPos(e){
  const rc=new THREE.Raycaster();
  const mx=document.pointerLockElement?0:(e.clientX/innerWidth)*2-1;
  const my=document.pointerLockElement?0:-(e.clientY/innerHeight)*2+1;
  rc.setFromCamera(new THREE.Vector2(mx,my),W.camera);
  const pt=new THREE.Vector3();
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  if(!rc.ray.intersectPlane(plane,pt))return null;
  if(Math.abs(pt.x)>19||Math.abs(pt.z)>19)return null;
  return new THREE.Vector3(snap(pt.x),.01,snap(pt.z));
}

function makeObj(item){
  if(!item||!item.mk)return b(1,1,1,M.white);
  try{return item.mk()}catch(e){console.error('Failed to make',item.id,e);return b(1,1,1,M.red)}
}

// Find placed object at center of screen
function findTarget(){
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),W.camera);
  const hits=rc.intersectObjects(W.placed,true);
  if(!hits.length)return null;
  let t=hits[0].object;
  while(t.parent&&t.parent!==W.scene&&W.placed.includes(t.parent))t=t.parent;
  return W.placed.includes(t)?t:null;
}

// Place item at event position
function place(e){
  if(!W.sel||W.mode!=='place')return;
  const pos=groundPos(e);if(!pos)return;
  pos.y=W.sel.w?1.4:.01;
  const obj=makeObj(W.sel);obj.position.copy(pos);
  if(W.placeRot!==0)obj.rotation.y=W.placeRot;
  else if(W.sel.w){const d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();obj.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
  obj.userData={id:W.sel.id,price:W.sel.p,name:W.sel.n,canRot:true};
  W.scene.add(obj);W.placed.push(obj);W.undoStack.push(obj);
  if(W.undoStack.length>50)W.undoStack.shift();
  W.total+=W.sel.p;W.placeRot=0;updB();
  hint('Placed: '+W.sel.n+' | Budget: $'+(W.budget-W.total).toLocaleString());
}

// Handle click for place/delete/rotate/move
function handleClick(e){
  if(W.mode==='place'){place(e);return}
  const t=findTarget();if(!t)return;
  if(W.mode==='delete'){W.total-=(t.userData.price||0);W.scene.remove(t);W.placed.splice(W.placed.indexOf(t),1);updB();hint('Deleted')}
  else if(W.mode==='rotate'){t.rotation.y+=Math.PI/2;hint('Rotated 90°')}
  else if(W.mode==='move'){
    W.placed.forEach(o=>delete o.userData._moving);
    if(W.moveTarget===t){const pos=groundPos(e);if(pos){pos.y=t.position.y;t.position.copy(pos);W.moveTarget=null;hint('Placed!')}return}
    t.userData._moving=true;W.moveTarget=t;hint('Click ground to place')
  }
}

// Ghost preview
let ghost=null;
function showGhost(item){
  if(!item)return;
  if(ghost){W.scene.remove(ghost);ghost=null}
  ghost=makeObj(item);
  ghost.traverse(c=>{if(c.material&&c.material.opacity!==undefined){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=.35}});
  W.scene.add(ghost);
}
canvas.addEventListener('pointermove',e=>{
  if(W.mode!=='place'||!W.sel)return;
  const pos=groundPos(e);if(!pos){if(ghost){W.scene.remove(ghost);ghost=null}return}
  if(!ghost)showGhost(W.sel);
  pos.y=W.sel.w?1.4:.01;ghost.position.copy(pos);
  if(W.placeRot!==0)ghost.rotation.y=W.placeRot;
  else if(W.sel.w){const d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();ghost.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
});

// Hover label
canvas.addEventListener('pointermove',e=>{
  const hl=document.getElementById('hl'),hln=document.getElementById('hln'),hlp=document.getElementById('hlp');
  const t=findTarget();
  if(t&&t.userData&&t.userData.name){
    const pos=new THREE.Vector3();t.getWorldPosition(pos);pos.project(W.camera);
    hl.style.display='block';hl.style.left=((pos.x*.5+.5)*innerWidth)+'px';hl.style.top=((-pos.y*.5+.5)*innerHeight-40)+'px';
    hln.textContent=t.userData.name;hlp.textContent='$'+(t.userData.price||0).toLocaleString();
  }else{hl.style.display='none'}
});

// Click handling
let mouseDown=false,mouseMoved=false,mdPos={x:0,y:0};
canvas.addEventListener('pointerdown',e=>{mouseDown=true;mouseMoved=false;mdPos={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointermove',e=>{if(mouseDown&&(Math.abs(e.clientX-mdPos.x)>2||Math.abs(e.clientY-mdPos.y)>2))mouseMoved=true});
canvas.addEventListener('pointerup',e=>{if(!mouseMoved){handleClick(e)}mouseDown=false});

// R key
document.addEventListener('keydown',e=>{
  if((e.key==='r'||e.key==='R')&&W.mode==='place'&&W.sel){e.preventDefault();W.placeRot=(W.placeRot+Math.PI/2)%(Math.PI*2);hint('↻ '+Math.round(W.placeRot*180/Math.PI)+'° — click to place '+W.sel.n)}
});

      btns.appendChild(lb);btns.appendChild(db);d.appendChild(btns);list.appendChild(d);
    });
  }catch(e){list.innerHTML='<div style="color:#f85149;font-size:12px;text-align:center;padding:20px">❌ Network error</div>'}
};

// Toolbar hooks
document.getElementById('bP').onclick=()=>window.setMode('place');
document.getElementById('bD').onclick=()=>window.setMode('delete');
document.getElementById('bR').onclick=()=>window.setMode('rotate');
document.getElementById('bM').onclick=()=>window.setMode('move');

// Init
window.switchTab('walls');
window.setMode('place');

// Resize + animate
function resize(){const w=innerWidth,h=innerHeight;W.renderer.setSize(w,h);W.camera.aspect=w/h;W.camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);W.controls.update();W.renderer.render(W.scene,W.camera)}anim();
</script>
