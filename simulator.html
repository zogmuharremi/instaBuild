<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #c{display:block;width:100%;height:100vh}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .topbar .logo{font-size:14px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}.topbar .logo em{font-style:normal;color:var(--g)}
    .topbar .logo-mark{width:22px;height:22px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:5px 10px;border-radius:5px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}.tb.red{border-color:rgba(248,81,73,.3);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.12)}
    .panel{position:fixed;left:6px;top:52px;bottom:6px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:8px;overflow-y:auto;width:220px;display:flex;flex-direction:column;gap:6px}
    .panel h3{font-size:10px;font-weight:700;color:var(--w)}
    .ptabs{display:flex;gap:3px;flex-wrap:wrap}
    .ptab{flex:1;min-width:40px;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px;border-radius:4px;font-size:8px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.ptab:hover{color:var(--w)}.ptab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .items{display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .item{background:var(--n3);border:1.5px solid var(--b);border-radius:5px;padding:4px;cursor:pointer;text-align:center;transition:.15s}.item:hover{border-color:rgba(255,255,255,.2)}.item.sel{border-color:var(--g);background:rgba(46,204,113,.06)}
    .item .ic{width:100%;height:24px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:15px}.item .in{font-size:7px;color:var(--s);line-height:1.2;margin-top:1px}.item.sel .in{color:var(--g)}.item .ip{font-size:6.5px;color:rgba(46,204,113,.5)}
    .prebuilds{display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .pre{background:var(--n3);border:1.5px solid var(--b);border-radius:5px;padding:5px;cursor:pointer;text-align:center;transition:.15s}.pre:hover{border-color:var(--g)}.pre .pi{font-size:20px}.pre .pn{font-size:9px;font-weight:600;color:var(--w)}.pre .ps{font-size:7px;color:var(--s)}
    .popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none}
    .popup.show{display:block}.popup h3{font-size:16px;color:var(--w);margin-bottom:8px}.popup p{font-size:13px;color:var(--s);margin-bottom:16px}.popup .btns{display:flex;gap:8px;justify-content:center}
    #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;pointer-events:none;z-index:40}
    @media(max-width:750px){.panel{width:180px;left:4px}}
    @media(max-width:550px){.panel{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click to lock · WASD walk · Mouse look · Space↑ Shift↓ · Select item then click ground to place</div>
<div class="topbar">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <div style="display:flex;gap:4px">
    <button class="tb on" id="bPlace">🔨 Place</button>
    <button class="tb" id="bDel">🗑️ Delete</button>
    <button class="tb" id="bRot">↻ Rotate</button>
    <button class="tb" id="bGrid">📐 Grid ON</button>
    <button class="tb" id="bPrebuild">🏘️ Prebuilds</button>
    <button class="tb" id="bMap">🌍 Map</button>
    <span style="color:var(--g);font-weight:700;font-size:12px;margin-left:4px" id="totalCost">$0</span>
    <button class="tb red" id="bClear">Clear</button>
  </div>
</div>
<div class="panel" id="panel">
  <h3>📦 Catalog</h3>
  <div class="ptabs" id="ptabs">
    <button class="ptab on" data-cat="walls">🧱 Walls</button>
    <button class="ptab" data-cat="windows">🪟 Win</button>
    <button class="ptab" data-cat="doors">🚪 Door</button>
    <button class="ptab" data-cat="furniture">🛋️ Furn</button>
    <button class="ptab" data-cat="outdoor">🌳 Out</button>

  <div class="items" id="items"></div>
</div>
<div class="popup" id="prebuildPopup">
  <h3>🏘️ Choose a Prebuild</h3>
  <p>Select a preset house — fully furnished, ready to customize.</p>
  <div class="prebuilds" id="prebuildList"></div>
  <div class="btns" style="margin-top:12px"><button class="tb" id="bClosePre">Cancel</button></div>
</div>
<div class="popup" id="mapPopup" style="max-width:700px;width:90%">
  <h3>🌍 Our Global Projects</h3>
  <div id="mapContainer" style="width:100%;height:400px;border-radius:8px;overflow:hidden"></div>
  <div class="btns" style="margin-top:12px"><button class="tb" id="bCloseMap">Close</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Map popup
document.getElementById('bMap').onclick=function(){
  document.getElementById('mapPopup').classList.add('show');
  setTimeout(function(){
    const mc=document.getElementById('mapContainer');if(!mc||mc._map)return;
    const map=L.map(mc,{scrollWheelZoom:false,zoomControl:true,attributionControl:false}).setView([35,8],3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
    const ac=[{n:'Kosovo',t:42.6,o:21,s:'active',c:104},{n:'USA',t:39.5,o:-98,s:'active',c:340},{n:'Austria',t:47.5,o:14.5,s:'active',c:70},{n:'Switzerland',t:46.8,o:8.2,s:'active',c:15},{n:'Germany',t:51,o:10.5,s:'expanding',c:0},{n:'UK',t:54.5,o:-3.5,s:'expanding',c:0},{n:'Netherlands',t:52.1,o:5.3,s:'expanding',c:0},{n:'France',t:46.6,o:2.2,s:'expanding',c:0},{n:'Italy',t:42,o:12.5,s:'expanding',c:0},{n:'Canada',t:56,o:-106,s:'expanding',c:0},{n:'UAE',t:24,o:54,s:'expanding',c:0}];
    const cv=new Set(ac.map(c=>c.n));const cls={active:'#2ecc71',expanding:'#f59e0b'};
    ac.forEach(p=>{const ic=L.divIcon({className:'',html:`<div style="width:12px;height:12px;background:${cls[p.s]};border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px ${cls[p.s]}44"></div>`,iconSize:[12,12],iconAnchor:[6,6]});const m=L.marker([p.t,p.o],{icon:ic}).addTo(map);m.bindPopup(`<div style="color:#c4ccd8;font-family:Inter;font-size:12px"><strong style="color:#fff;font-size:13px">${p.n}</strong><br><span style="color:${cls[p.s]};font-weight:600">${p.s==='active'?'✓ Active':'↗ Coming'}</span>${p.c?'<br>'+p.c+' projects':''}</div>`,{maxWidth:200})});
    mc._map=map;new ResizeObserver(()=>map.invalidateSize()).observe(mc);
  },200);
};
document.getElementById('bCloseMap').onclick=function(){document.getElementById('mapPopup').classList.remove('show')};
</script>

y:.01,z:4},{t:'o_fe',x:4.5,y:.01,z:4}]}];

let sel=null,cat='walls',mode='place',gridOn=true,total=0;

function renderCat(){const el=document.getElementById('items');el.innerHTML='';catalog[cat].forEach(item=>{const d=document.createElement('div');d.className='item'+(sel&&sel.id===item.id?' sel':'');d.innerHTML=`<div class="ic">${item.i}</div><div class="in">${item.n}</div><div class="ip">$${item.p}</div>`;d.onclick=function(){document.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sel=item;document.getElementById('hint').textContent='Selected: '+item.n+' — Click ground to place'};el.appendChild(d)})}
renderCat();

document.querySelectorAll('.ptab').forEach(t=>{t.onclick=function(){document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('on'));this.classList.add('on');cat=this.dataset.cat;renderCat()}});

function snap(v){return gridOn?Math.round(v/.5)*.5:v}
function makeObj(item){if(item.tree){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=.75;t.castShadow=true;g.add(t);const cr=new THREE.Mesh(new THREE.ConeGeometry(.7,.9,8),M.leaf);cr.position.y=1.5;cr.castShadow=true;g.add(cr);return g}
if(item.palm){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=1.25;t.castShadow=true;g.add(t);for(let f=0;f<6;f++){const fr=new THREE.Mesh(new THREE.BoxGeometry(.8,.02,.2),new THREE.MeshStandardMaterial({color:'#5a9a3e',roughness:.4,side:THREE.DoubleSide}));fr.position.set(0,2.6,0);fr.rotation.set(.3+Math.random()*.4,f/6*Math.PI*2,Math.random()*.3);fr.castShadow=true;g.add(fr)}return g}
if(item.pitched){const g=new THREE.Group();const p1=new THREE.Mesh(item.g(),item.m());p1.position.set(0,.3,-.7);p1.rotation.x=-.6;p1.castShadow=true;g.add(p1);const p2=new THREE.Mesh(item.g(),item.m());p2.position.set(0,.3,.7);p2.rotation.x=.6;p2.castShadow=true;g.add(p2);return g}
const obj=new THREE.Mesh(item.g(),item.m());obj.castShadow=true;obj.receiveShadow=true;return obj}

function loadPrebuild(pb){placed.forEach(o=>S.remove(o));placed.length=0;total=0;pb.items.forEach(it=>{const ci=catalog[cat];let found=null;for(const k in catalog){const f=catalog[k].find(x=>x.id===it.t);if(f){found=f;break}}if(!found)return;const obj=makeObj(found);obj.position.set(it.x||0,it.y||.01,it.z||0);if(it.ry)obj.rotation.y=it.ry;obj.userData={id:found.id,price:found.p};S.add(obj);placed.push(obj);total+=found.p});document.getElementById('totalCost').textContent='$'+total.toLocaleString();document.getElementById('prebuildPopup').classList.remove('show')}

function doClick(e){if(!locked)return;if(mode!=='place'||!sel)return;
  const rc=new THREE.Raycaster();const ms=new THREE.Vector2(0,0);rc.setFromCamera(ms,cam);
  const dir=rc.ray.direction.clone(),orig=rc.ray.origin.clone();
  if(dir.y>=0)return;const t=-orig.y/dir.y;const pt=new THREE.Vector3(orig.x+dir.x*t,0,orig.z+dir.z*t);
  if(Math.abs(pt.x)>19||Math.abs(pt.z)>19)return;
  const x=snap(pt.x),z=snap(pt.z);
  const obj=makeObj(sel);obj.position.set(x,.01,z);obj.rotation.y=Math.round(cam.rotation.y/(Math.PI/2))*(Math.PI/2);
  obj.userData={id:sel.id,price:sel.p,canRot:!0};S.add(obj);placed.push(obj);
  total+=sel.p;document.getElementById('totalCost').textContent='$'+total.toLocaleString();
}

canvas.addEventListener('dblclick',function(e){
  if(!locked||mode==='place')return;
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);
  const hits=rc.intersectObjects(placed,true);
  if(hits.length>0){let tgt=hits[0].object;while(tgt.parent&&tgt.parent!==S&&placed.includes(tgt.parent))tgt=tgt.parent;
    if(mode==='delete'&&placed.includes(tgt)){total-=(tgt.userData.price||0);S.remove(tgt);placed.splice(placed.indexOf(tgt),1);document.getElementById('totalCost').textContent='$'+total.toLocaleString()}
    else if(mode==='rotate'&&tgt.userData.canRot!==false){tgt.rotation.y+=Math.PI/2}}
});

// Toolbar buttons
document.getElementById('bPlace').onclick=function(){mode='place';this.classList.add('on');document.getElementById('bDel').classList.remove('on');document.getElementById('bRot').classList.remove('on');document.getElementById('hint').textContent=sel?'Place mode — click ground to place '+sel.n:'Place mode — select an item first'};
document.getElementById('bDel').onclick=function(){mode='delete';this.classList.add('on');document.getElementById('bPlace').classList.remove('on');document.getElementById('bRot').classList.remove('on');document.getElementById('hint').textContent='Delete mode — double-click objects to remove'};
document.getElementById('bRot').onclick=function(){mode='rotate';this.classList.add('on');document.getElementById('bPlace').classList.remove('on');document.getElementById('bDel').classList.remove('on');document.getElementById('hint').textContent='Rotate mode — double-click objects to rotate 90°'};
document.getElementById('bGrid').onclick=function(){gridOn=!gridOn;grid.visible=gridOn;this.textContent='📐 Grid '+(gridOn?'ON':'OFF');if(!gridOn)this.classList.add('on');else this.classList.remove('on')};
document.getElementById('bClear').onclick=function(){if(!confirm('Clear all placed items?'))return;placed.forEach(o=>S.remove(o));placed.length=0;total=0;document.getElementById('totalCost').textContent='$0'};
// Prebuilds
document.getElementById('bPrebuild').onclick=function(){const el=document.getElementById('prebuildList');el.innerHTML='';prebuilds.forEach(pb=>{const d=document.createElement('div');d.className='pre';d.innerHTML=`<div class="pi">${pb.i}</div><div class="pn">${pb.n}</div><div class="ps">${pb.s}<br>$${pb.p.toLocaleString()}</div>`;d.onclick=function(){loadPrebuild(pb)};el.appendChild(d)});document.getElementById('prebuildPopup').classList.add('show')};
document.getElementById('bClosePre').onclick=function(){document.getElementById('prebuildPopup').classList.remove('show')};

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);const dt=Math.min(clk.getDelta(),.1),s=7*dt;
  if(locked){const d=new THREE.Vector3();cam.getWorldDirection(d);d.y=0;d.normalize();const r=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0)).normalize();if(keys.w)cam.position.addScaledVector(d,s);if(keys.s)cam.position.addScaledVector(d,-s);if(keys.a)cam.position.addScaledVector(r,-s);if(keys.d)cam.position.addScaledVector(r,s);if(keys[' '])cam.position.y+=s;if(keys.shift)cam.position.y-=s;cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch}
  R.render(S,cam)}anim();
</script>
