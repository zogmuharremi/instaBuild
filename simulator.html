<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — 3D Builder</title>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #c{display:block;width:100%;height:100vh}
    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:5px 10px;display:flex;align-items:center;justify-content:space-between;gap:3px;flex-wrap:wrap}
    .top .logo{font-size:13px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:4px;text-decoration:none}.top .logo em{font-style:normal;color:var(--g)}
    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}.tb.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:4px;top:48px;bottom:4px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:220px}
    .side h3{font-size:9px;font-weight:700;color:var(--w);margin-bottom:3px}
    .tabs{display:flex;gap:1px;margin-bottom:4px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(46,204,113,.06)}
    .it .i{font-size:14px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6px;color:rgba(46,204,113,.4)}
    .prebox{display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .pr{background:var(--n3);border:1.5px solid var(--b);border-radius:5px;padding:5px;cursor:pointer;transition:.15s}.pr:hover{border-color:var(--g)}.pr .pi{font-size:16px}.pr .pn{font-size:8px;font-weight:600;color:var(--w)}.pr .ps{font-size:7px;color:var(--s)}
    .pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:480px;width:90%}.pop.on{display:block}.pop h3{font-size:15px;color:var(--w);margin-bottom:6px}.pop p{font-size:11px;color:var(--s);margin-bottom:10px}
    #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;pointer-events:none;z-index:40}
    @media(max-width:700px){.side{width:180px;left:2px}}@media(max-width:500px){.side{display:none}.top{padding:3px 6px}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click canvas to lock · WASD walk · Pick item → click ground</div>
<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" id="bG">📐 Grid ON</button>
  <button class="tb" id="bPre">🏘️ Prebuilds</button>
  <button class="tb" id="bUndo">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="total">$0</span>
  <button class="tb red" id="bClr">Clear</button>
</div>
<div class="side" id="side">
  <h3>📦 Catalog</h3>
  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="walls">🧱</button><button class="tab" data-cat="windows">🪟</button><button class="tab" data-cat="doors">🚪</button><button class="tab" data-cat="floors">🟫</button><button class="tab" data-cat="furniture">🛋️</button><button class="tab" data-cat="kitchen">🍳</button><button class="tab" data-cat="outdoor">🌳</button><button class="tab" data-cat="roofs">🏠</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="pop" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click to load — fully furnished.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" id="bClosePre">Cancel</button></div></div>

document.addEventListener('keydown',e=>W.keys[e.key.toLowerCase()]=true);

W.mm=function(e){W.yaw-=e.movementX*.002;W.pitch-=e.movementY*.002;W.pitch=Math.max(-1.4,Math.min(1.4,W.pitch))};

W.sel=null;W.catKey='walls';W.placed=[];W.undoStack=[];
W.hint=function(t){document.getElementById('hint').textContent=t};
W.snap=function(v){return W.gridOn?Math.round(v/.5)*.5:v};
W.updCost=function(){document.getElementById('total').textContent='$'+W.total.toLocaleString()};

// ─── RENDER CATALOG ───
W.renderCat=function(){
  const el=document.getElementById('grid');el.innerHTML='';
  W.cat[W.catKey].forEach(item=>{
    const d=document.createElement('div');d.className='it'+(W.sel&&W.sel.id===item.id?' s':'');
    d.innerHTML='<div class="i">'+item.i+'</div><div class="n">'+item.n+'</div><div class="p">$'+item.p+'</div>';
    d.onclick=function(){document.querySelectorAll('.it').forEach(x=>x.classList.remove('s'));d.classList.add('s');W.sel=item;W.hint('Selected: '+item.n+' — Click ground to place')};
    el.appendChild(d);
  });
};
W.renderCat();

// ─── TAB CLICKS ───
document.querySelectorAll('.tab').forEach(t=>{t.onclick=function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));this.classList.add('on');W.catKey=this.dataset.cat;W.renderCat()}});

// ─── MAKE OBJECT ───
W.makeObj=function(item){
  if(item.tree){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=.7;t.castShadow=true;g.add(t);const cr=new THREE.Mesh(new THREE.ConeGeometry(.65,.85,8),M.leaf);cr.position.y=1.4;cr.castShadow=true;g.add(cr);return g}
  if(item.palm){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=1.2;t.castShadow=true;g.add(t);for(let f=0;f<6;f++){const fr=new THREE.Mesh(new THREE.BoxGeometry(.75,.02,.2),new THREE.MeshStandardMaterial({color:'#5a9a3e',roughness:.4,side:THREE.DoubleSide}));fr.position.set(0,2.5,0);fr.rotation.set(.3+Math.random()*.4,f/6*Math.PI*2,Math.random()*.3);fr.castShadow=true;g.add(fr)}return g}
  if(item.pitched){const g=new THREE.Group();const p1=new THREE.Mesh(item.g(),item.m());p1.position.set(0,.28,-.65);p1.rotation.x=-.6;p1.castShadow=true;g.add(p1);const p2=new THREE.Mesh(item.g(),item.m());p2.position.set(0,.28,.65);p2.rotation.x=.6;p2.castShadow=true;g.add(p2);return g}
  const obj=new THREE.Mesh(item.g(),item.m());obj.castShadow=true;obj.receiveShadow=true;return obj
};

// ─── RAYCASTER ───
W.getPos=function(){
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),W.cam);
  const d=rc.ray.direction.clone(),o=rc.ray.origin.clone();
  if(d.y>=0)return null;
  const t=-o.y/d.y;
  return new THREE.Vector3(W.snap(o.x+d.x*t),.01,W.snap(o.z+d.z*t));
};

// ─── HANDLE CLICK (PLACE) ───
W.handleClick=function(){
  if(W.pMode!=='place'||!W.sel||!W.locked)return;
  const pos=W.getPos();if(!pos||Math.abs(pos.x)>19||Math.abs(pos.z)>19)return;
  const obj=W.makeObj(W.sel);
  pos.y=W.sel.wall?1.4:.01;
  obj.position.copy(pos);
  if(W.sel.wall)obj.rotation.y=Math.round(W.cam.rotation.y/(Math.PI/2))*(Math.PI/2);
  obj.userData={id:W.sel.id,price:W.sel.p,canRot:true};
  W.S.add(obj);W.placed.push(obj);
  W.undoStack.push(obj);if(W.undoStack.length>50)W.undoStack.shift();
  W.total+=W.sel.p;W.updCost();
};

// ─── HANDLE DOUBLE CLICK (DELETE/ROTATE/MOVE) ───
W.handleDblClick=function(){
  if(W.pMode==='place')return;
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),W.cam);
  const hits=rc.intersectObjects(W.placed,true);
  if(hits.length===0){if(W.pMode==='move'){const mo=W.placed.find(o=>o.userData._moving);if(mo){const pos=W.getPos();if(pos){mo.position.set(pos.x,mo.position.y,pos.z);mo.userData._moving=false;W.hint('Moved!')}}}return}
  let tgt=hits[0].object;
  while(tgt.parent&&tgt.parent!==W.S&&W.placed.includes(tgt.parent))tgt=tgt.parent;
  if(!W.placed.includes(tgt))return;
  if(W.pMode==='delete'){W.total-=(tgt.userData.price||0);W.S.remove(tgt);W.placed.splice(W.placed.indexOf(tgt),1);W.updCost();W.hint('Deleted')}
  else if(W.pMode==='rotate'){tgt.rotation.y+=Math.PI/2;W.hint('Rotated 90°')}
  else if(W.pMode==='move'){W.placed.forEach(o=>delete o.userData._moving);tgt.userData._moving=true;W.hint('Moving: click ground to place it')}
};

// ─── TOOLBAR (global onclick) ───
window.setMode=function(m){
  W.pMode=m;['bP','bD','bR','bM'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',['place','delete','rotate','move'][i]===m));
  W.hint({place:W.sel?'Place: click ground to place '+W.sel.n:'Place: select item first',delete:'Delete: double-click objects',rotate:'Rotate: double-click to spin 90°',move:'Move: double-click then click new spot'}[m]||'');
};
window.toggleGrid=function(){W.gridOn=!W.gridOn;W.gridH.visible=W.gridOn;document.getElementById('bG').textContent='📐 Grid '+(W.gridOn?'ON':'OFF');document.getElementById('bG').classList.toggle('on',!W.gridOn)};
window.doUndo=function(){const obj=W.undoStack.pop();if(obj){W.total-=(obj.userData.price||0);W.S.remove(obj);W.placed.splice(W.placed.indexOf(obj),1);W.updCost();W.hint('Undone')}};
window.doClear=function(){if(!confirm('Clear everything?'))return;W.placed.forEach(o=>W.S.remove(o));W.placed.length=0;W.undoStack.length=0;W.total=0;W.updCost();W.hint('Cleared')};
window.showPrebuilds=function(){
  const el=document.getElementById('preList');el.innerHTML='';
  W.prebuilds.forEach(pb=>{const d=document.createElement('div');d.className='pr';d.innerHTML='<div class="pi">'+pb.i+'</div><div class="pn">'+pb.n+'</div><div class="ps">'+pb.s+'</div>';d.onclick=function(){window.loadPrebuild(pb)};el.appendChild(d)});
  document.getElementById('prePop').classList.add('on');
};
window.closePre=function(){document.getElementById('prePop').classList.remove('on')};
window.loadPrebuild=function(pb){
  W.placed.forEach(o=>W.S.remove(o));W.placed.length=0;W.undoStack.length=0;W.total=0;
  let count=0;
  pb.items.forEach(it=>{
    const found=W.allItems[it.t];
    if(!found){console.warn('Missing:',it.t);return}
    const obj=W.makeObj(found);
    obj.position.set(it.x||0,found.wall?1.4:.01,it.z||0);
    if(it.ry)obj.rotation.y=it.ry;
    obj.userData={id:found.id,price:found.p,canRot:true};
    W.S.add(obj);W.placed.push(obj);W.total+=found.p;count++;
  });
  W.updCost();W.hint('Loaded: '+pb.n+' ('+count+' items)');
  document.getElementById('prePop').classList.remove('on');
  console.log('Prebuild loaded:',pb.n,count,'items');
};

// ─── BUTTON HOOKS ───
document.getElementById('bP').onclick=function(){window.setMode('place')};
document.getElementById('bD').onclick=function(){window.setMode('delete')};
document.getElementById('bR').onclick=function(){window.setMode('rotate')};
document.getElementById('bM').onclick=function(){window.setMode('move')};
document.getElementById('bG').onclick=window.toggleGrid;
document.getElementById('bUndo').onclick=window.doUndo;
document.getElementById('bClr').onclick=window.doClear;
document.getElementById('bPre').onclick=window.showPrebuilds;
document.getElementById('bClosePre').onclick=window.closePre;

// ─── RESIZE + ANIMATE ───
function resize(){const w=innerWidth,h=innerHeight;W.R.setSize(w,h);W.cam.aspect=w/h;W.cam.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);const dt=Math.min(W.clk.getDelta(),.1),s=7*dt;
  if(W.locked){const d=new THREE.Vector3();W.cam.getWorldDirection(d);d.y=0;d.normalize();const r=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0)).normalize();if(W.keys.w)W.cam.position.addScaledVector(d,s);if(W.keys.s)W.cam.position.addScaledVector(d,-s);if(W.keys.a)W.cam.position.addScaledVector(r,-s);if(W.keys.d)W.cam.position.addScaledVector(r,s);if(W.keys[' '])W.cam.position.y+=s;if(W.keys.shift)W.cam.position.y-=s;W.cam.rotation.order='YXZ';W.cam.rotation.y=W.yaw;W.cam.rotation.x=W.pitch}
  W.R.render(W.S,W.cam)}anim();
console.log('🏗️ instaBuild 3D Builder ready! Click canvas to start.');
