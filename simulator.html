<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — Build Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #canvas3d{display:block;width:100%;height:100vh;cursor:crosshair}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
    .topbar .logo{font-size:15px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:6px;text-decoration:none}.topbar .logo em{font-style:normal;color:var(--g)}
    .topbar .logo-mark{width:24px;height:24px;background:var(--g);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:11px}
    .tbtn{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}.tbtn:hover{color:var(--w);border-color:rgba(255,255,255,.15)}.tbtn.active{background:var(--g);border-color:var(--g);color:var(--n)}.tbtn.danger{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.3);color:#f85149}.tbtn.danger:hover{background:rgba(248,81,73,.2)}
    .catalog{position:fixed;left:8px;top:60px;bottom:8px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:12px;padding:10px;overflow-y:auto;width:240px;display:flex;flex-direction:column;gap:8px}
    .catalog h3{font-size:11px;font-weight:700;color:var(--w)}
    .cat-tabs{display:flex;gap:4px;flex-wrap:wrap}
    .cat-tab{flex:1;min-width:50px;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:5px;border-radius:5px;font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.2s}.cat-tab:hover{color:var(--w)}.cat-tab.active{background:var(--g);border-color:var(--g);color:var(--n)}
    .cat-items{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .cat-item{background:var(--n3);border:1.5px solid var(--b);border-radius:6px;padding:5px;cursor:pointer;text-align:center;transition:.2s}.cat-item:hover{border-color:rgba(255,255,255,.2)}.cat-item.active{border-color:var(--g);background:rgba(46,204,113,.06)}
    .cat-item .ci{width:100%;height:30px;border-radius:3px;background-size:cover;background-position:center;margin-bottom:3px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .cat-item .cn{font-size:8px;color:var(--s);line-height:1.1}.cat-item.active .cn{color:var(--g)}
    .cat-item .cp{font-size:7px;color:rgba(46,204,113,.6)}
    .toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:60}
    .toolbar button{background:rgba(17,22,32,.95);border:1px solid var(--b);color:var(--s);padding:8px 16px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}.toolbar button:hover{color:var(--w)}.toolbar button.active{background:var(--g);border-color:var(--g);color:var(--n)}
    .hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.18);font-size:10px;pointer-events:none;z-index:40}
    .ghost-preview{position:fixed;pointer-events:none;z-index:30;color:var(--g);font-size:12px;font-weight:600;text-shadow:0 0 10px rgba(46,204,113,.5);display:none}
    @media(max-width:800px){.catalog{width:200px;left:4px}}
    @media(max-width:600px){.catalog{display:none}}
  </style>
</head>
<body>

<canvas id="canvas3d"></canvas>
<div class="hint" id="hint">Click to lock mouse · WASD walk · Mouse look · Space↑ Shift↓ · Click catalog item, then click world to place</div>

<div class="topbar">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <div style="display:flex;gap:6px">
    <button class="tbtn active" id="btnPlace">🔨 Place</button>
    <button class="tbtn" id="btnDelete">🗑️ Delete</button>
    <button class="tbtn" id="btnRotate">↻ Rotate</button>
    <button class="tbtn" id="btnGrid">📐 Grid: 0.5m</button>
    <span style="color:var(--g);font-size:12px;font-weight:600;display:flex;align-items:center;margin-left:8px" id="priceTag">$0</span>
    <button class="tbtn danger" id="btnClear">Clear All</button>
    <a href="index.html" class="tbtn" style="text-decoration:none">← Site</a>
  </div>
</div>

<div class="catalog" id="catalog">
  <h3>📦 Catalog</h3>
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="walls">🧱 Walls</button>
    <button class="cat-tab" data-cat="windows">🪟 Windows</button>
    <button class="cat-tab" data-cat="doors">🚪 Doors</button>
    <button class="cat-tab" data-cat="furniture">🛋️ Furniture</button>
    <button class="cat-tab" data-cat="outdoor">🌳 Outdoor</button>
    <button class="cat-tab" data-cat="roofs">🏠 Roofs</button>
  </div>
  <div class="cat-items" id="catItems"></div>
</div>

<script type="module">
import*as THREE from'three';

const canvas=document.getElementById('canvas3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(2);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#0d1a2d');scene.fog=new THREE.Fog('#0d1a2d',20,50);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,40);camera.position.set(0,1.6,0);
const clock=new THREE.Clock();const keys={};let yaw=0,pitch=0,pointerLocked=false;
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
canvas.addEventListener('click',e=>{if(!pointerLocked)canvas.requestPointerLock();else handleWorldClick(e)});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===canvas;if(pointerLocked)document.addEventListener('mousemove',onMouse);else document.removeEventListener('mousemove',onMouse)});
function onMouse(e){yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.4,Math.min(1.4,pitch))}

// Lights
scene.add(new THREE.AmbientLight('#c8ddf8',.6));
const sun=new THREE.DirectionalLight('#fffef5',3.0);sun.position.set(14,10,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
scene.add(new THREE.HemisphereLight('#c8ddf8','#3a5030',.3));

// Ground grid
const gridHelper=new THREE.GridHelper(30,30,'#2ecc71','#1a2a1e');gridHelper.position.y=.005;scene.add(gridHelper);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#3a5a2a',roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;ground.receiveShadow=true;scene.add(ground);

// Materials
const mSteel=new THREE.MeshStandardMaterial({color:'#5a6878',roughness:.3,metalness:.85});
const mGlass=new THREE.MeshStandardMaterial({color:'#c8ddf8',roughness:.03,metalness:.05,transparent:true,opacity:.5});
const mWood=new THREE.MeshStandardMaterial({color:'#c09870',roughness:.5});
const mBrick=new THREE.MeshStandardMaterial({color:'#b05040',roughness:.55});
const mWhite=new THREE.MeshStandardMaterial({color:'#f0f3f7',roughness:.45});
const mDoor=new THREE.MeshStandardMaterial({color:'#2a3545',roughness:.2,metalness:.55});
const mConcrete=new THREE.MeshStandardMaterial({color:'#c4c8ce',roughness:.7});

let selectedItem=null,placeMode='place',gridSize=0.5,totalCost=0;
const placedObjects=[];

// Catalog
const catalog={
  walls:[
    {id:'wall_white',name:'White Wall',icon:'⬜',price:200,geo:()=>new THREE.BoxGeometry(2,.1,2.8),mat:()=>mWhite,rot:!0},
    {id:'wall_brick',name:'Brick Wall',icon:'🧱',price:350,geo:()=>new THREE.BoxGeometry(2,.1,2.8),mat:()=>mBrick,rot:!0},
    {id:'wall_wood',name:'Wood Wall',icon:'🪵',price:400,geo:()=>new THREE.BoxGeometry(2,.1,2.8),mat:()=>mWood,rot:!0},
    {id:'floor_wood',name:'Wood Floor',icon:'🟫',price:150,geo:()=>new THREE.BoxGeometry(2,.05,2),mat:()=>mWood,rot:!1},
    {id:'floor_tile',name:'Tile Floor',icon:'⬜',price:200,geo:()=>new THREE.BoxGeometry(2,.05,2),mat:()=>new THREE.MeshStandardMaterial({color:'#d0d0d0',roughness:.3}),rot:!1},
    {id:'column',name:'Steel Column',icon:'▯',price:300,geo:()=>new THREE.BoxGeometry(.15,.15,3),mat:()=>mSteel,rot:!1},
  ],
  windows:[
    {id:'win_small',name:'Small Window',icon:'🪟',price:500,geo:()=>new THREE.BoxGeometry(1,.9,.05),mat:()=>mGlass,rot:!0},
    {id:'win_large',name:'Large Window',icon:'🪟',price:800,geo:()=>new THREE.BoxGeometry(1.4,1.3,.05),mat:()=>mGlass,rot:!0},
    {id:'win_round',name:'Round Window',icon:'⭕',price:600,geo:()=>new THREE.CylinderGeometry(.4,.4,.05,16),mat:()=>mGlass,rot:!1},
  ],
  doors:[
    {id:'door_front',name:'Front Door',icon:'🚪',price:1200,geo:()=>new THREE.BoxGeometry(.9,2.2,.06),mat:()=>mDoor,rot:!0},
    {id:'door_garage',name:'Garage Door',icon:'🚗',price:2500,geo:()=>new THREE.BoxGeometry(2.5,2.2,.06),mat:()=>new THREE.MeshStandardMaterial({color:'#d8dce3',roughness:.28,metalness:.65}),rot:!0},
    {id:'door_double',name:'Double Door',icon:'🚪🚪',price:2000,geo:()=>new THREE.BoxGeometry(1.6,2.2,.06),mat:()=>mDoor,rot:!0},
  ],
  furniture:[
    {id:'sofa',name:'Sofa',icon:'🛋️',price:1500,geo:()=>new THREE.BoxGeometry(2,.6,.8),mat:()=>new THREE.MeshStandardMaterial({color:'#e8e8e4',roughness:.4}),rot:!0},
    {id:'table',name:'Dining Table',icon:'🍽️',price:800,geo:()=>new THREE.BoxGeometry(1.4,.04,.9),mat:()=>mWood,rot:!0},
    {id:'bed',name:'Bed',icon:'🛏️',price:1200,geo:()=>new THREE.BoxGeometry(1.6,.3,2),mat:()=>mWood,rot:!0},
    {id:'chair',name:'Chair',icon:'🪑',price:300,geo:()=>new THREE.BoxGeometry(.4,.4,.4),mat:()=>mWood,rot:!1},
    {id:'counter',name:'Kitchen Counter',icon:'🍳',price:1000,geo:()=>new THREE.BoxGeometry(2,.4,.6),mat:()=>mWhite,rot:!0},
    {id:'fridge',name:'Fridge',icon:'🧊',price:1800,geo:()=>new THREE.BoxGeometry(.7,.7,.7),mat:()=>new THREE.MeshStandardMaterial({color:'#c0c0c0',roughness:.2,metalness:.7}),rot:!1},
    {id:'tv',name:'TV Unit',icon:'📺',price:900,geo:()=>new THREE.BoxGeometry(1.2,.3,.15),mat:()=>new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.2}),rot:!0},
    {id:'bookshelf',name:'Bookshelf',icon:'📚',price:600,geo:()=>new THREE.BoxGeometry(1,.3,1.5),mat:()=>mWood,rot:!0},
    {id:'rug',name:'Rug',icon:'🟫',price:400,geo:()=>new THREE.BoxGeometry(2,.02,1.5),mat:()=>new THREE.MeshStandardMaterial({color:'#8b7355',roughness:.8}),rot:!1},
  ],
  outdoor:[
    {id:'tree_small',name:'Small Tree',icon:'🌳',price:300,tree:!0,geo:()=>new THREE.CylinderGeometry(.08,.12,1.5,8),mat:()=>new THREE.MeshStandardMaterial({color:'#6b4d3a',roughness:.8}),rot:!1},
    {id:'tree_tall',name:'Tall Tree',icon:'🌲',price:500,tree:!0,geo:()=>new THREE.CylinderGeometry(.1,.16,2.2,8),mat:()=>new THREE.MeshStandardMaterial({color:'#6b4d3a',roughness:.8}),rot:!1},
    {id:'bush',name:'Bush',icon:'🪴',price:150,geo:()=>new THREE.SphereGeometry(.4,6,4),mat:()=>new THREE.MeshStandardMaterial({color:'#4a7a3a',roughness:.6}),rot:!1},
    {id:'fountain',name:'Fountain',icon:'⛲',price:3000,geo:()=>new THREE.CylinderGeometry(.5,.6,.3,12),mat:()=>new THREE.MeshStandardMaterial({color:'#a0a0a0',roughness:.3}),rot:!1},
    {id:'fence',name:'Fence Panel',icon:'🚧',price:200,geo:()=>new THREE.BoxGeometry(1,.8,.04),mat:()=>mWood,rot:!0},
    {id:'path_stone',name:'Stone Path',icon:'🪨',price:100,geo:()=>new THREE.BoxGeometry(.6,.03,.8),mat:()=>new THREE.MeshStandardMaterial({color:'#c0b8a8',roughness:.6}),rot:!1},
  ],
  roofs:[
    {id:'roof_flat',name:'Flat Roof',icon:'▬',price:2000,geo:()=>new THREE.BoxGeometry(3,.08,3),mat:()=>new THREE.MeshStandardMaterial({color:'#3d4855',roughness:.4}),rot:!1},
    {id:'roof_pitched',name:'Pitched Roof',icon:'△',price:3500,geo:()=>new THREE.BoxGeometry(3,.08,3),mat:()=>new THREE.MeshStandardMaterial({color:'#3d4855',roughness:.4}),rot:!1,pitched:!0},
    {id:'roof_metal',name:'Metal Roof',icon:'🔩',price:4000,geo:()=>new THREE.BoxGeometry(3,.08,3),mat:()=>new THREE.MeshStandardMaterial({color:'#8899aa',roughness:.22,metalness:.55}),rot:!1},
  ]
};
let currentCat='walls';

function renderCatalog(){
  const items=catalog[currentCat],grid=document.getElementById('catItems');grid.innerHTML='';
  items.forEach(item=>{
    const div=document.createElement('div');div.className='cat-item';if(selectedItem&&selectedItem.id===item.id)div.classList.add('active');
    div.innerHTML=`<div class="ci">${item.icon}</div><div class="cn">${item.name}</div><div class="cp">$${item.price.toLocaleString()}</div>`;
    div.onclick=()=>{document.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('active'));div.classList.add('active');selectedItem=item;document.getElementById('hint').textContent=`Selected: ${item.name} ($${item.price}) — Click in world to place`};
    grid.appendChild(div);
  });
}
renderCatalog();

document.querySelectorAll('.cat-tab').forEach(t=>{t.onclick=function(){document.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('active'));this.classList.add('active');currentCat=this.dataset.cat;renderCatalog()}});

// Toolbar
document.getElementById('btnPlace').onclick=function(){placeMode='place';this.classList.add('active');document.getElementById('btnDelete').classList.remove('active');document.getElementById('btnRotate').classList.remove('active');document.getElementById('hint').textContent=selectedItem?`Place mode — click to place ${selectedItem.name}`:'Place mode — select an item from catalog first'};
document.getElementById('btnDelete').onclick=function(){placeMode='delete';this.classList.add('active');document.getElementById('btnPlace').classList.remove('active');document.getElementById('btnRotate').classList.remove('active');document.getElementById('hint').textContent='Delete mode — click objects to remove them'};
document.getElementById('btnRotate').onclick=function(){placeMode='rotate';this.classList.add('active');document.getElementById('btnPlace').classList.remove('active');document.getElementById('btnDelete').classList.remove('active');document.getElementById('hint').textContent='Rotate mode — click objects to rotate 90°'};
document.getElementById('btnClear').onclick=function(){if(confirm('Remove all placed objects?')){placedObjects.forEach(o=>scene.remove(o));placedObjects.length=0;totalCost=0;document.getElementById('priceTag').textContent='$0'}};

let gridOn=true;
document.getElementById('btnGrid').onclick=function(){gridOn=!gridOn;gridHelper.visible=gridOn;this.textContent='📐 Grid: '+(gridOn?gridSize+'m':'OFF')};

function snap(val){return gridOn?Math.round(val/gridSize)*gridSize:val}

function handleWorldClick(e){
  if(!pointerLocked||placeMode==='place')return; // Only delete/rotate on click when not placing
}
// Place items by clicking canvas when pointer locked
canvas.addEventListener('click',function(e){
  if(!pointerLocked||!selectedItem||placeMode!=='place')return;
  const item=selectedItem;
  // Raycast to find ground position
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2(0,0); // center of screen
  raycaster.setFromCamera(mouse,camera);
  const dir=raycaster.ray.direction.clone();const orig=raycaster.ray.origin.clone();
  // Intersect with y=0 plane
  if(dir.y>=0)return; // looking up, skip
  const t=-orig.y/dir.y;const pt=new THREE.Vector3(orig.x+dir.x*t,0,orig.z+dir.z*t);
  if(Math.abs(pt.x)>14||Math.abs(pt.z)>14)return; // out of bounds

  const x=snap(pt.x),z=snap(pt.z);
  // Create object
  let obj;
  if(item.tree){// Tree with leaves
    const grp=new THREE.Group();
    const trunk=new THREE.Mesh(item.geo(),item.mat());trunk.position.y=.75;trunk.castShadow=true;grp.add(trunk);
    const crown=new THREE.Mesh(new THREE.ConeGeometry(.7,.9,8),new THREE.MeshStandardMaterial({color:'#3d6b2e',roughness:.65}));crown.position.y=1.5;crown.castShadow=true;grp.add(crown);
    obj=grp;
  }else if(item.pitched){// Pitched roof panel
    const grp=new THREE.Group();const panel=item.geo();
    const p1=new THREE.Mesh(panel,item.mat());p1.position.set(0,.3,-.7);p1.rotation.x=-.6;p1.castShadow=true;grp.add(p1);
    const p2=new THREE.Mesh(panel,item.mat());p2.position.set(0,.3,.7);p2.rotation.x=.6;p2.castShadow=true;grp.add(p2);
    obj=grp;
  }else{
    obj=new THREE.Mesh(item.geo(),item.mat());obj.castShadow=true;obj.receiveShadow=true;
  }
  obj.position.set(x,.01,z);
  if(item.rot){obj.rotation.y=Math.round(camera.rotation.y/(Math.PI/2))*(Math.PI/2)} // snap rotation to 90°
  obj.userData={itemId:item.id,price:item.price,canRotate:!!item.rot};
  scene.add(obj);placedObjects.push(obj);
  totalCost+=item.price;document.getElementById('priceTag').textContent='$'+totalCost.toLocaleString();
});

// Also allow clicking objects for delete/rotate
canvas.addEventListener('dblclick',function(e){
  if(!pointerLocked||placeMode==='place')return;
  const raycaster=new THREE.Raycaster();
  const mouse2=new THREE.Vector2(0,0);raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(placedObjects,true);
  if(hits.length>0){
    let target=hits[0].object;while(target.parent&&target.parent!==scene&&placedObjects.includes(target.parent))target=target.parent;
    if(placeMode==='delete'&&placedObjects.includes(target)){totalCost-=(target.userData.price||0);scene.remove(target);placedObjects.splice(placedObjects.indexOf(target),1);document.getElementById('priceTag').textContent='$'+totalCost.toLocaleString()}
    else if(placeMode==='rotate'&&target.userData.canRotate){target.rotation.y+=Math.PI/2}
  }
});

// Resize
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();

// Animate
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.1),spd=6*dt;
  if(pointerLocked){const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();if(keys.w)camera.position.addScaledVector(dir,spd);if(keys.s)camera.position.addScaledVector(dir,-spd);if(keys.a)camera.position.addScaledVector(right,-spd);if(keys.d)camera.position.addScaledVector(right,spd);if(keys[' '])camera.position.y+=spd;if(keys.shift)camera.position.y-=spd;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}
  renderer.render(scene,camera)}animate();
</script>
</body>
</html>
