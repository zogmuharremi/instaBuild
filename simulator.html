<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuild — Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#2ecc71;--gd:#27ae60;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}
    #c{display:block;width:100%;height:100vh;cursor:crosshair}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
    .topbar .logo{font-size:14px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}.topbar .logo em{font-style:normal;color:var(--g)}
    .topbar .logo-mark{width:22px;height:22px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:5px 10px;border-radius:5px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:var(--n)}.tb.red{border-color:rgba(248,81,73,.3);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.12)}
    .panel{position:fixed;left:6px;top:52px;bottom:6px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:230px;display:flex;flex-direction:column;gap:4px}
    .panel h3{font-size:10px;font-weight:700;color:var(--w)}
    .ptabs{display:flex;gap:2px;flex-wrap:wrap}
    .ptab{flex:1;min-width:35px;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:3px 2px;border-radius:4px;font-size:7.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.ptab:hover{color:var(--w)}.ptab.on{background:var(--g);border-color:var(--g);color:var(--n)}
    .items{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .item{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.item:hover{border-color:rgba(255,255,255,.2)}.item.sel{border-color:var(--g);background:rgba(46,204,113,.06)}
    .item .ic{width:100%;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px}.item .in{font-size:7px;color:var(--s);line-height:1.1;margin-top:1px}.item.sel .in{color:var(--g)}.item .ip{font-size:6px;color:rgba(46,204,113,.5)}
    .prebuilds{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .pre{background:var(--n3);border:1.5px solid var(--b);border-radius:5px;padding:5px;cursor:pointer;transition:.15s}.pre:hover{border-color:var(--g)}.pre .pi{font-size:18px}.pre .pn{font-size:9px;font-weight:600;color:var(--w)}.pre .ps{font-size:7px;color:var(--s)}
    .popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:500px;width:90%}
    .popup.show{display:block}.popup h3{font-size:16px;color:var(--w);margin-bottom:8px}.popup p{font-size:12px;color:var(--s);margin-bottom:12px}
    #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.15);font-size:10px;pointer-events:none;z-index:40}
    @media(max-width:750px){.panel{width:180px;left:4px}}@media(max-width:550px){.panel{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Click to lock · WASD walk · Mouse look · Space↑ Shift↓ · Select item then click ground to place</div>
<div class="topbar">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <div style="display:flex;gap:3px">
    <button class="tb on" id="bP">🔨 Place</button>
    <button class="tb" id="bD">🗑️ Delete</button>
    <button class="tb" id="bR">↻ Rotate</button>
    <button class="tb" id="bM">✋ Move</button>
    <button class="tb" id="bG">📐 Grid ON</button>
    <button class="tb" id="bB">🏘️ Prebuilds</button>
    <button class="tb" id="bMap">🌍 Map</button>
    <span style="color:var(--g);font-weight:700;font-size:12px;margin-left:4px" id="totalCost">$0</span>
    <button class="tb red" id="bClr">Clear</button>
  </div>
</div>
<div class="panel" id="panel">
  <h3>📦 Catalog</h3>
  <div class="ptabs" id="ptabs">
    <button class="ptab on" data-cat="walls">🧱</button><button class="ptab" data-cat="windows">🪟</button><button class="ptab" data-cat="doors">🚪</button><button class="ptab" data-cat="floors">🟫</button><button class="ptab" data-cat="furn">🛋️</button><button class="ptab" data-cat="kitchen">🍳</button><button class="ptab" data-cat="outdoor">🌳</button><button class="ptab" data-cat="roofs">🏠</button>
  </div>
  <div class="items" id="items"></div>
</div>
<div class="popup" id="prebuildPopup">
  <h3>🏘️ Choose a Prebuilt Home</h3>
  <p>Click to load — fully furnished, ready to customize.</p>
  <div class="prebuilds" id="prebuildList"></div>
  <div style="margin-top:12px"><button class="tb" id="bClosePre">Cancel</button></div>
</div>
<div class="popup" id="mapPopup" style="max-width:700px">
  <h3>🌍 Global Projects</h3>
  <div id="mapContainer" style="width:100%;height:400px;border-radius:8px;overflow:hidden"></div>
  <div style="margin-top:12px"><button class="tb" id="bCloseMap">Close</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.getElementById('bMap').onclick=function(){
  document.getElementById('mapPopup').classList.add('show');
  setTimeout(function(){
    const mc=document.getElementById('mapContainer');if(!mc||mc._map)return;
    const map=L.map(mc,{scrollWheelZoom:false,zoomControl:true,attributionControl:false}).setView([35,8],3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
    const ac=[{n:'Kosovo',t:42.6,o:21,s:'active',c:104},{n:'USA',t:39.5,o:-98,s:'active',c:340},{n:'Austria',t:47.5,o:14.5,s:'active',c:70},{n:'Switzerland',t:46.8,o:8.2,s:'active',c:15},{n:'Germany',t:51,o:10.5,s:'expanding',c:0},{n:'UK',t:54.5,o:-3.5,s:'expanding',c:0},{n:'Netherlands',t:52.1,o:5.3,s:'expanding',c:0},{n:'France',t:46.6,o:2.2,s:'expanding',c:0},{n:'Italy',t:42,o:12.5,s:'expanding',c:0},{n:'Canada',t:56,o:-106,s:'expanding',c:0},{n:'UAE',t:24,o:54,s:'expanding',c:0}];
    const cls={active:'#2ecc71',expanding:'#f59e0b'};
    ac.forEach(p=>{const ic=L.divIcon({className:'',html:`<div style="width:12px;height:12px;background:${cls[p.s]};border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 3px ${cls[p.s]}44"></div>`,iconSize:[12,12],iconAnchor:[6,6]});const m=L.marker([p.t,p.o],{icon:ic}).addTo(map);m.bindPopup(`<div style="color:#c4ccd8;font-family:Inter;font-size:12px"><strong style="color:#fff;font-size:13px">${p.n}</strong><br><span style="color:${cls[p.s]};font-weight:600">${p.s==='active'?'✓ Active':'↗ Coming'}</span>${p.c?'<br>'+p.c+' projects':''}</div>`,{maxWidth:200})});
    mc._map=map;new ResizeObserver(()=>map.invalidateSize()).observe(mc);
  },200);
};
document.getElementById('bCloseMap').onclick=function(){document.getElementById('mapPopup').classList.remove('show')};
</script>

let sel=null,cat='walls';

const allItems={};for(const k in catalog)catalog[k].forEach(it=>allItems[it.id]=it);

function renderCat(){const el=document.getElementById('items');el.innerHTML='';catalog[cat].forEach(item=>{const d=document.createElement('div');d.className='item'+(sel&&sel.id===item.id?' sel':'');d.innerHTML=`<div class="ic">${item.i}</div><div class="in">${item.n}</div><div class="ip">$${item.p}</div>`;d.onclick=function(){document.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sel=item;document.getElementById('hint').textContent='Selected: '+item.n+' — Click ground to place'};el.appendChild(d)})}

document.querySelectorAll('.ptab').forEach(t=>{t.onclick=function(){document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('on'));this.classList.add('on');cat=this.dataset.cat;renderCat()}});

function snap(v){return gridOn?Math.round(v/.5)*.5:v}
function makeObj(item){
  if(item.tree){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=.75;t.castShadow=true;g.add(t);const cr=new THREE.Mesh(new THREE.ConeGeometry(.7,.9,8),Mt.leaf);cr.position.y=1.5;cr.castShadow=true;g.add(cr);return g}
  if(item.palm){const g=new THREE.Group();const t=new THREE.Mesh(item.g(),item.m());t.position.y=1.25;t.castShadow=true;g.add(t);for(let f=0;f<6;f++){const fr=new THREE.Mesh(new THREE.BoxGeometry(.8,.02,.2),new THREE.MeshStandardMaterial({color:'#5a9a3e',roughness:.4,side:THREE.DoubleSide}));fr.position.set(0,2.6,0);fr.rotation.set(.3+Math.random()*.4,f/6*Math.PI*2,Math.random()*.3);fr.castShadow=true;g.add(fr)}return g}
  if(item.pitched){const g=new THREE.Group();const p1=new THREE.Mesh(item.g(),item.m());p1.position.set(0,.3,-.7);p1.rotation.x=-.6;p1.castShadow=true;g.add(p1);const p2=new THREE.Mesh(item.g(),item.m());p2.position.set(0,.3,.7);p2.rotation.x=.6;p2.castShadow=true;g.add(p2);return g}
  const obj=new THREE.Mesh(item.g(),item.m());obj.castShadow=true;obj.receiveShadow=true;return obj
}

function loadPrebuild(pb){
  placed.forEach(o=>S.remove(o));placed.length=0;total=0;
  pb.items.forEach(it=>{
    const found=allItems[it.t];if(!found)return;
    const obj=makeObj(found);
    obj.position.set(it.x||0,(found.wall?1.4:.01),it.z||0);
    if(it.ry)obj.rotation.y=it.ry;
    obj.userData={id:found.id,price:found.p,canRot:!0};S.add(obj);placed.push(obj);total+=found.p;
  });
  document.getElementById('totalCost').textContent='$'+total.toLocaleString();
  document.getElementById('prebuildPopup').classList.remove('show');
}

function doClick(e){
  if(!locked)return;
  if(mode==='place'&&sel){// Place
    const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);
    const dir=rc.ray.direction.clone(),orig=rc.ray.origin.clone();
    if(dir.y>=0&&!sel.wall)return;const t=sel.wall?.1||-orig.y/dir.y;
    const pt=new THREE.Vector3(orig.x+dir.x*t,sel.wall?1.4:.01,orig.z+dir.z*t);
    if(Math.abs(pt.x)>19||Math.abs(pt.z)>19)return;
    const x=snap(pt.x),z=snap(pt.z);
    const obj=makeObj(sel);obj.position.set(x,pt.y,z);
    if(sel.wall)obj.rotation.y=Math.round(cam.rotation.y/(Math.PI/2))*(Math.PI/2);
    obj.userData={id:sel.id,price:sel.p,canRot:!0};S.add(obj);placed.push(obj);total+=sel.p;
    document.getElementById('totalCost').textContent='$'+total.toLocaleString();
  }
}
canvas.addEventListener('dblclick',function(e){
  if(!locked||mode==='place')return;
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),cam);
  const hits=rc.intersectObjects(placed,true);
  if(hits.length>0){let tgt=hits[0].object;while(tgt.parent&&tgt.parent!==S&&placed.includes(tgt.parent))tgt=tgt.parent;
    if(mode==='delete'&&placed.includes(tgt)){total-=(tgt.userData.price||0);S.remove(tgt);placed.splice(placed.indexOf(tgt),1);document.getElementById('totalCost').textContent='$'+total.toLocaleString()}
    else if(mode==='rotate'&&tgt.userData.canRot){tgt.rotation.y+=Math.PI/2}
    else if(mode==='move'&&placed.includes(tgt)){tgt.userData._moving=!tgt.userData._moving;tgt.userData._moveCam=new THREE.Vector3().copy(cam.position);document.getElementById('hint').textContent=tgt.userData._moving?'Moving — point where you want it and click':'Move mode — double-click object to start moving'}}
  }else if(mode==='move'){// Click ground to move selected object
    const movingObj=placed.find(o=>o.userData._moving);
    if(!movingObj)return;
    const rc2=new THREE.Raycaster();rc2.setFromCamera(new THREE.Vector2(0,0),cam);
    const d2=rc2.ray.direction.clone(),o2=rc2.ray.origin.clone();
    if(d2.y>=0)return;const t2=-o2.y/d2.y;
    movingObj.position.set(snap(o2.x+d2.x*t2),movingObj.position.y,snap(o2.z+d2.z*t2));
    movingObj.userData._moving=false;document.getElementById('hint').textContent='Object moved! Double-click another to move it';
  }
});

document.getElementById('bB').onclick=function(){const el=document.getElementById('prebuildList');el.innerHTML='';prebuilds.forEach(pb=>{const d=document.createElement('div');d.className='pre';d.innerHTML=`<div class="pi">${pb.i}</div><div class="pn">${pb.n}</div><div class="ps">${pb.s}</div>`;d.onclick=function(){loadPrebuild(pb)};el.appendChild(d)});document.getElementById('prebuildPopup').classList.add('show')};
document.getElementById('bClosePre').onclick=function(){document.getElementById('prebuildPopup').classList.remove('show')};

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
function anim(){requestAnimationFrame(anim);const dt=Math.min(clk.getDelta(),.1),s=7*dt;
  if(locked){const d=new THREE.Vector3();cam.getWorldDirection(d);d.y=0;d.normalize();const r=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0)).normalize();if(keys.w)cam.position.addScaledVector(d,s);if(keys.s)cam.position.addScaledVector(d,-s);if(keys.a)cam.position.addScaledVector(r,-s);if(keys.d)cam.position.addScaledVector(r,s);if(keys[' '])cam.position.y+=s;if(keys.shift)cam.position.y-=s;cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch}
  R.render(S,cam)}anim();
