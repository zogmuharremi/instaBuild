<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instaBuilt — 3D Builder</title>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{--g:#1ea855;--gd:#178a44;--n:#0a0e14;--n2:#111620;--n3:#1a1f2e;--w:#fff;--b:#1e2533;--s:#8892a4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--n);color:#c4ccd8;overflow:hidden;height:100vh}

    .top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,20,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:5px 10px;display:flex;align-items:center;justify-content:space-between;gap:3px;flex-wrap:wrap}

    .top .logo-mark{width:20px;height:20px;background:var(--g);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px}
    .tb{background:var(--n3);border:1px solid var(--b);color:var(--s);padding:4px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.tb:hover{color:var(--w);border-color:rgba(255,255,255,.2)}.tb.on{background:var(--g);border-color:var(--g);color:#fff}.tb.red{background:rgba(248,81,73,.1);border-color:rgba(248,81,73,.25);color:#f85149}.tb.red:hover{background:rgba(248,81,73,.2)}
    .side{position:fixed;left:4px;top:48px;bottom:4px;z-index:50;background:rgba(17,22,32,.97);border:1px solid var(--b);border-radius:10px;padding:6px;overflow-y:auto;width:220px}
    .side h3{font-size:9px;font-weight:700;color:var(--w)}
    .tabs{display:flex;gap:1px}.tab{flex:1;background:var(--n3);border:1px solid var(--b);color:var(--s);padding:2px 1px;border-radius:3px;font-size:7px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}.tab:hover{color:var(--w)}.tab.on{background:var(--g);border-color:var(--g);color:#fff}
    .items{display:grid;grid-template-columns:1fr 1fr;gap:2px}
    .it{background:var(--n3);border:1.5px solid var(--b);border-radius:4px;padding:3px;cursor:pointer;text-align:center;transition:.15s}.it:hover{border-color:rgba(255,255,255,.2)}.it.s{border-color:var(--g);background:rgba(30,168,85,.06)}
    .it .i{font-size:14px;line-height:18px}.it .n{font-size:7px;color:var(--s)}.it.s .n{color:var(--g)}.it .p{font-size:6px;color:rgba(30,168,85,.4)}
    .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:2px;vertical-align:middle;border:1px solid rgba(255,255,255,.1)}
    .pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--n2);border:1px solid var(--b);border-radius:12px;padding:20px;text-align:center;display:none;max-width:500px;width:90%}.pop.show{display:block}.pop h3{font-size:15px;color:var(--w);margin-bottom:6px}.pop p{font-size:11px;color:var(--s);margin-bottom:10px}

    @media(max-width:700px){.side{width:180px;left:2px}}@media(max-width:500px){.side{display:none}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Pick item from catalog → click ground · R to rotate · Scroll to zoom</div>
<div class="hl" id="hl"><span id="hln"></span><br><span class="hlp" id="hlp"></span></div>

<div class="top">
  <a href="index.html" class="logo"><div class="logo-mark">iB</div>insta<em>Built</em></a>
  <button class="tb on" id="bP">🔨 Place</button>
  <button class="tb" id="bD">🗑️ Delete</button>
  <button class="tb" id="bR">↻ Rotate</button>
  <button class="tb" id="bM">✋ Move</button>
  <button class="tb" onclick="toggleGrid()">📐 Grid ON</button>
  <button class="tb" onclick="showPre()">🏘️ Prebuilds</button>
  <button class="tb" onclick="showMap()">🌍 Map</button>
  <button class="tb" onclick="doUndo()">↩ Undo</button>
  <span style="color:var(--g);font-weight:700;font-size:12px" id="budget">💰 $100,000</span>
  <button class="tb" onclick="showSave()" style="color:#f59e0b;border-color:rgba(245,158,11,.3)">💾 Save</button>
  <button class="tb red" onclick="doClear()">Clear</button>
</div>
<div class="side"><h3>📦 Catalog</h3>
  <div class="tabs" id="tabs">
    <button class="tab on" data-cat="walls" onclick="window.switchTab('walls')">🧱</button><button class="tab" data-cat="windows" onclick="window.switchTab('windows')">🪟</button><button class="tab" data-cat="doors" onclick="window.switchTab('doors')">🚪</button><button class="tab" data-cat="floors" onclick="window.switchTab('floors')">🟫</button><button class="tab" data-cat="furniture" onclick="window.switchTab('furniture')">🛋️</button><button class="tab" data-cat="kitchen" onclick="window.switchTab('kitchen')">🍳</button><button class="tab" data-cat="outdoor" onclick="window.switchTab('outdoor')">🌳</button><button class="tab" data-cat="roofs" onclick="window.switchTab('roofs')">🏠</button>
  </div>
  <div class="items" id="items"></div>
</div>
<div class="pop" id="prePop"><h3>🏘️ Prebuilt Homes</h3><p>Click to load — fully furnished.</p><div class="prebox" id="preList"></div><div style="margin-top:10px"><button class="tb" onclick="document.getElementById('prePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="savePop"><h3>💾 Save Project</h3><input id="pnInput" style="width:100%;padding:10px;background:var(--n3);border:1px solid var(--b);border-radius:6px;color:var(--w);font-size:13px;font-family:Inter;outline:none;margin-bottom:10px" placeholder="My Dream Home"><button class="tb" onclick="doSave()" style="background:var(--g);color:#fff;width:100%">💾 Save</button><div style="margin-top:6px"><button class="tb" onclick="document.getElementById('savePop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="loadPop"><h3>📂 Load Project</h3><div id="loadList" style="max-height:300px;overflow-y:auto"><div style="color:var(--s);font-size:12px;text-align:center;padding:20px">Loading...</div></div><div style="margin-top:10px"><button class="tb" onclick="document.getElementById('loadPop').classList.remove('show')">Cancel</button></div></div>
<div class="pop" id="mapPop" style="max-width:90vw"><h3>🌍 Global Projects</h3><div id="mapContainer" style="width:80vw;max-width:900px;height:500px;border-radius:8px;overflow:hidden;margin:0 auto"></div><div style="margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="tb on" data-mm="all">All</button><button class="tb" data-mm="active">Active</button><button class="tb" data-mm="density">Density</button><button class="tb" data-mm="relief">Relief</button></div><div style="margin-top:8px"><button class="tb" onclick="document.getElementById('mapPop').classList.remove('show')">Close</button></div></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.showMap=function(){
  document.getElementById('mapPop').classList.add('show');
  setTimeout(function(){
    const mc=document.getElementById('mapContainer');if(!mc||mc._map)return;
    const map=L.map(mc,{scrollWheelZoom:false,zoomControl:true,attributionControl:false}).setView([35,8],3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
    const ac=[{n:'Kosovo',t:42.6,o:21,s:'active',c:104},{n:'USA',t:39.5,o:-98,s:'active',c:340},{n:'Austria',t:47.5,o:14.5,s:'active',c:70},{n:'Switzerland',t:46.8,o:8.2,s:'active',c:15},{n:'Germany',t:51,o:10.5,s:'expanding',c:0},{n:'UK',t:54.5,o:-3.5,s:'expanding',c:0},{n:'Netherlands',t:52.1,o:5.3,s:'expanding',c:0},{n:'France',t:46.6,o:2.2,s:'expanding',c:0},{n:'Italy',t:42,o:12.5,s:'expanding',c:0},{n:'Canada',t:56,o:-106,s:'expanding',c:0},{n:'UAE',t:24,o:54,s:'expanding',c:0}];
    const relief=[{n:'Turkey',t:39,o:35,desc:'2023 Earthquake · 200 units'},{n:'Germany',t:51,o:10.5,desc:'2021 Floods · 150 homes'},{n:'Canada',t:56,o:-106,desc:'2024 Wildfires · 80 units'},{n:'Ukraine',t:49,o:31,desc:'2022-Present · 500+ UNHCR'},{n:'Greece',t:39,o:22,desc:'2023 Wildfires · 60 homes'}];
    const cls={active:'#1ea855',expanding:'#f59e0b',unavailable:'#f85149',relief:'#ef4444'};const cv=new Set(ac.map(c=>c.n));
    const wc=[{n:'Spain',t:40,o:-3},{n:'Portugal',t:39.5,o:-8},{n:'Norway',t:62,o:10},{n:'Sweden',t:62,o:15}];let mode='all';
    function rM(m){mc._m&&mc._m.forEach(mk=>map.removeLayer(mk));const ms=[];mode=m;let maxC=0;ac.forEach(p=>{if(p.c>maxC)maxC=p.c});
    if(m==='density'){ac.forEach(p=>{if(p.c===0)return;const r=6+(p.c/maxC)*22;const ic=L.divIcon({className:'',html:`<div style="width:${r}px;height:${r}px;background:rgba(30,168,85,${.3+(p.c/maxC)*.6});border-radius:50%;border:2px solid rgba(30,168,85,.8)"></div>`,iconSize:[r,r],iconAnchor:[r/2,r/2]});ms.push(L.marker([p.t,p.o],{icon:ic}).addTo(map).bindPopup(`<div style="color:#333;font-family:Inter;font-size:13px"><strong>${p.n}</strong><br><span style="color:#1ea855">${p.c} projects</span></div>`))})}
    else if(m==='relief'){relief.forEach(p=>{const ic=L.divIcon({className:'',html:`<div style="width:13px;height:13px;background:${cls.relief};border:2px solid #fff;box-shadow:0 0 0 3px ${cls.relief}44;transform:rotate(45deg)"></div>`,iconSize:[13,13],iconAnchor:[7,7]});ms.push(L.marker([p.t,p.o],{icon:ic}).addTo(map).bindPopup(`<div style="color:#333;font-family:Inter;font-size:12px"><strong>🆘 ${p.n}</strong><br><span style="color:#ef4444">${p.desc}</span></div>`))})}
    else{ac.forEach(p=>{if(m==='active'&&p.s!=='active')return;const ic=L.divIcon({className:'',html:`<div style="width:12px;height:12px;background:${cls[p.s]};border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 3px ${cls[p.s]}44"></div>`,iconSize:[12,12],iconAnchor:[6,6]});ms.push(L.marker([p.t,p.o],{icon:ic}).addTo(map).bindPopup(`<div style="color:#333;font-family:Inter;font-size:12px"><strong>${p.n}</strong><br><span style="color:${cls[p.s]}">${p.s==='active'?'✓ Active':'↗ Coming'}</span>${p.c?'<br>'+p.c+' projects':''}</div>`))})
    if(m==='all'){wc.forEach(p=>{if(cv.has(p.n))return;const ic=L.divIcon({className:'',html:`<div style="width:7px;height:7px;background:${cls.unavailable};border-radius:50%;border:1.5px solid #fff;opacity:.5"></div>`,iconSize:[7,7],iconAnchor:[4,4]});ms.push(L.marker([p.t,p.o],{icon:ic}).addTo(map).bindPopup(`<div style="color:#333;font-family:Inter;font-size:13px"><strong>${p.n}</strong><br><span style="color:#f85149">✗ Not Available</span></div>`))})}}mc._m=ms}rM('all');
    document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=function(){document.querySelectorAll('[data-mm]').forEach(x=>x.classList.remove('on'));this.classList.add('on');rM(this.dataset.mm)});
    mc._map=map;new ResizeObserver(()=>map.invalidateSize()).observe(mc);
  },200);
};
</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';

const W=window._W={};W.scene=null;W.camera=null;W.controls=null;W.renderer=null;
W.mode='place';W.gridOn=true;W.budget=100000;W.sel=null;W.catKey='walls';
W.placeRot=0;W.placed=[];W.undoStack=[];W.allItems={};W.prebuilds=[];
W.moveTarget=null;W.ghost=null;
const canvas=document.getElementById('c');
W.renderer=new THREE.WebGLRenderer({canvas,antialias:true});W.renderer.setPixelRatio(Math.min(devicePixelRatio,2));W.renderer.shadowMap.enabled=true;W.renderer.toneMapping=THREE.ACESFilmicToneMapping;W.renderer.toneMappingExposure=1.15;
W.scene=new THREE.Scene();W.scene.background=new THREE.Color('#c8dff0');W.scene.fog=new THREE.Fog('#c8dff0',30,70);

W.scene.add(new THREE.HemisphereLight('#d8e8f8','#6a7a50',.4));
W.gridH=new THREE.GridHelper(50,50,'#1ea855','#c0c8c0');W.gridH.position.set(0,.005,0);W.scene.add(W.gridH);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#4a6a3a',roughness:.85}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;W.scene.add(ground);

// ─── MATERIALS ───
const M={};const mm=(n,o)=>{M[n]=new THREE.MeshStandardMaterial(o)};
mm('steel',{color:'#5a6878',roughness:.3,metalness:.85});mm('glass',{color:'#c8ddf8',roughness:.03,metalness:.05,transparent:true,opacity:.45});mm('wood',{color:'#c09870',roughness:.5});mm('brick',{color:'#b05040',roughness:.55});mm('white',{color:'#f5f5f0',roughness:.4});mm('beige',{color:'#e8dfd2',roughness:.45});mm('gray',{color:'#9ca8b4',roughness:.45});mm('navy',{color:'#2a3a55',roughness:.45});mm('metalW',{color:'#8899aa',roughness:.22,metalness:.55});mm('door',{color:'#2a3545',roughness:.2,metalness:.55});mm('silver',{color:'#d0d0d0',roughness:.15,metalness:.7});mm('oak',{color:'#c4a882',roughness:.5});mm('walnut',{color:'#5c3d2e',roughness:.45});mm('cherry',{color:'#8b3a3a',roughness:.4});mm('cabinet',{color:'#6b4a2e',roughness:.45});mm('sofaC',{color:'#e8e4dc',roughness:.45});mm('sofaT',{color:'#c4b8a8',roughness:.45});mm('mattress',{color:'#f8f4ec',roughness:.6});mm('bedFrame',{color:'#8b6f4a',roughness:.5});mm('leaf',{color:'#3d6b2e',roughness:.65});mm('bark',{color:'#6b4d3a',roughness:.8});mm('bush',{color:'#4a7a3a',roughness:.6});mm('pool',{color:'#4080c0',roughness:.15,metalness:.2});mm('fountain',{color:'#b0b0b0',roughness:.25});mm('path',{color:'#c8c0b8',roughness:.55});mm('lantern',{color:'#f0a030',roughness:.3,emissive:'#f0a030',emissiveIntensity:.3});mm('roof',{color:'#3d4855',roughness:.4});mm('roofMetal',{color:'#8899aa',roughness:.22,metalness:.55});mm('roofTerra',{color:'#b55a3a',roughness:.4});mm('conc',{color:'#c4c8ce',roughness:.7});mm('rug',{color:'#8b7355',roughness:.8});mm('tile',{color:'#d8d4d0',roughness:.3});mm('marble',{color:'#e8e0d8',roughness:.12});mm('darkW',{color:'#4a2a1a',roughness:.4});mm('grass',{color:'#5a8a3e',roughness:.8});

// ─── HELPERS ───
function b(w,h,d,m){const g=new THREE.BoxGeometry(w,h,d);const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o}
function cyl(r,h,m,s=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m);o.castShadow=true;return o}

function G(...c){const g=new THREE.Group();c.forEach(x=>g.add(x));return g}
function set(g,x,y,z,ry=0){g.position.set(x||0,y||0,z||0);g.rotation.y=ry;return g}

// ─── FURNITURE FACTORIES (all fixed, realistic sizes) ───
function fSofa(){return set(G(b(1.8,.45,.7,M.sofaC),b(1.8,.55,.06,M.sofaC),b(.07,.3,.7,M.sofaC),b(.07,.3,.7,M.sofaC)),0,.01,0)}

function fTV(){return set(G(b(1.1,.25,.22,M.oak),b(1.05,.015,.6,M.silver),b(.03,.015,.6,M.silver)),0,.01,0)}

  return g
}
function fDesk(){return set(G(b(1.2,.03,.55,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak),cyl(.02,.7,M.oak)),0,.01,0)}

  for(let x=-.14;x<=.14;x+=.14)for(let z=-.14;z<=.14;z+=.14){const bnr=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.01,8),M.silver);bnr.position.set(x,.02,z);g.add(bnr)}

function hint(t){document.getElementById('hint').textContent=t}
function updB(){document.getElementById('budget').textContent='💰 $'+(W.budget-W.total).toLocaleString()}
function snap(v){return W.gridOn?Math.round(v/.5)*.5:v}
function makeObj(it){if(!it||!it.mk)return b(1,1,1,M.white);try{return it.mk()}catch(e){return b(1,1,1,M.white)}}

function groundPos(e){
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(((e.clientX/innerWidth)*2-1),(-(e.clientY/innerHeight)*2+1)),W.camera);
  const pt=new THREE.Vector3();const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  if(!rc.ray.intersectPlane(plane,pt))return null;
  if(Math.abs(pt.x)>24||Math.abs(pt.z)>24)return null;
  return new THREE.Vector3(snap(pt.x),.01,snap(pt.z));
}

function findTarget(){
  const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(0,0),W.camera);
  const hits=rc.intersectObjects(W.placed,true);if(!hits.length)return null;
  let t=hits[0].object;while(t.parent&&t.parent!==W.scene&&W.placed.includes(t.parent))t=t.parent;
  return W.placed.includes(t)?t:null;
}

function place(e){
  if(!W.sel||W.mode!=='place')return;const pos=groundPos(e);if(!pos)return;
  pos.y=W.sel.w?1.4:.01;const obj=makeObj(W.sel);obj.position.copy(pos);
  if(W.placeRot!==0)obj.rotation.y=W.placeRot;
  else if(W.sel.w){const d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();obj.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
  obj.userData={id:W.sel.id,price:W.sel.p,name:W.sel.n,canRot:true};W.scene.add(obj);W.placed.push(obj);W.undoStack.push(obj);
  if(W.undoStack.length>50)W.undoStack.shift();W.total+=W.sel.p;W.placeRot=0;updB();hint('Placed: '+W.sel.n)
}

function handleClick(e){
  if(W.mode==='place'){place(e);return}
  const t=findTarget();if(!t)return;
  if(W.mode==='delete'){W.total-=(t.userData.price||0);W.scene.remove(t);W.placed.splice(W.placed.indexOf(t),1);updB();hint('Deleted')}
  else if(W.mode==='rotate'){t.rotation.y+=Math.PI/2;hint('Rotated 90°')}
  else if(W.mode==='move'){W.placed.forEach(o=>delete o.userData._moving);if(W.moveTarget===t){const pos=groundPos(e);if(pos){pos.y=t.position.y;t.position.copy(pos);W.moveTarget=null;hint('Placed!')}return}t.userData._moving=true;W.moveTarget=t;hint('Click ground to place')}
}

let ghost=null;
canvas.addEventListener('pointermove',e=>{
  if(W.mode!=='place'||!W.sel)return;const pos=groundPos(e);if(!pos){if(ghost){W.scene.remove(ghost);ghost=null}return}
  if(!ghost){ghost=makeObj(W.sel);ghost.traverse(c=>{if(c.material&&c.material.opacity!==undefined){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=.3}});W.scene.add(ghost)}
  pos.y=W.sel.w?1.4:.01;ghost.position.copy(pos);
  if(W.placeRot!==0)ghost.rotation.y=W.placeRot;
  else if(W.sel.w){const d=new THREE.Vector3().subVectors(pos,W.camera.position).setY(0).normalize();ghost.rotation.y=Math.round(Math.atan2(d.x,d.z)/(Math.PI/2))*Math.PI/2}
});
canvas.addEventListener('pointermove',e=>{
  const hl=document.getElementById('hl'),hln=document.getElementById('hln'),hlp=document.getElementById('hlp'),t=findTarget();
  if(t&&t.userData&&t.userData.name){const pos=new THREE.Vector3();t.getWorldPosition(pos);pos.project(W.camera);hl.style.display='block';hl.style.left=((pos.x*.5+.5)*innerWidth)+'px';hl.style.top=((-pos.y*.5+.5)*innerHeight-40)+'px';hln.textContent=t.userData.name;hlp.textContent='$'+(t.userData.price||0).toLocaleString()}else{hl.style.display='none'}
});

let md=false,mm=false,mp={x:0,y:0};
canvas.addEventListener('pointerdown',e=>{md=true;mm=false;mp={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointermove',e=>{if(md&&(Math.abs(e.clientX-mp.x)>2||Math.abs(e.clientY-mp.y)>2))mm=true});
canvas.addEventListener('pointerup',e=>{if(!mm)handleClick(e);md=false});
document.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&W.mode==='place'&&W.sel){e.preventDefault();W.placeRot=(W.placeRot+Math.PI/2)%(Math.PI*2);hint('↻ '+Math.round(W.placeRot*180/Math.PI)+'° — click to place '+W.sel.n)}});

window.switchTab=function(k){
  W.catKey=k;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.cat===k));
  const el=document.getElementById('items');el.innerHTML='';
  W.cat[k].forEach(it=>{const d=document.createElement('div');d.className='it'+(W.sel&&W.sel.id===it.id?' s':'');d.innerHTML='<span class="swatch" style="background:'+it.sw+'"></span>'+it.i+'<div class="n">'+it.n+'</div><div class="p">$'+it.p+'</div>';d.onclick=function(){document.querySelectorAll('.it').forEach(x=>x.classList.remove('s'));d.classList.add('s');W.sel=it;W.placeRot=0;if(ghost){W.scene.remove(ghost);ghost=null}hint('Selected: '+it.n+' — click ground, R to rotate')};el.appendChild(d)})
};
window.setMode=function(m){W.mode=m;['P','D','R','M'].forEach((l,i)=>document.getElementById('b'+l).classList.toggle('on',['place','delete','rotate','move'][i]===m));W.placeRot=0;W.moveTarget=null;if(ghost){W.scene.remove(ghost);ghost=null}hint({place:W.sel?'Place: click ground | R=rotate '+W.sel.n:'Place: select item first',delete:'Delete: click object',rotate:'Rotate: click object to spin 90°',move:'Move: click object, then click ground'}[m])};
window.toggleGrid=function(){W.gridOn=!W.gridOn;W.gridH.visible=W.gridOn;const b=document.querySelector('[onclick*="toggleGrid"]');if(b){b.textContent='📐 Grid '+(W.gridOn?'ON':'OFF');b.classList.toggle('on',!W.gridOn)}};
window.doUndo=function(){const obj=W.undoStack.pop();if(obj){W.total-=(obj.userData.price||0);W.scene.remove(obj);W.placed.splice(W.placed.indexOf(obj),1);updB();hint('Undone')}};
window.doClear=function(){if(!confirm('Clear all?'))return;W.placed.forEach(o=>W.scene.remove(o));W.placed.length=0;W.undoStack.length=0;W.total=0;updB();hint('Cleared')};
window.showPre=function(){const el=document.getElementById('preList');el.innerHTML='';W.prebuilds.forEach(pb=>{const d=document.createElement('div');d.className='pr';d.innerHTML='<div class="pi">'+pb.i+'</div><div class="pn">'+pb.n+'</div><div class="ps">'+pb.s+'</div>';d.onclick=function(){W.placed.forEach(o=>W.scene.remove(o));W.placed.length=0;W.undoStack.length=0;W.total=0;let c=0;pb.items.forEach(it=>{const f=W.allItems[it.t];if(!f)return;const obj=makeObj(f);set(obj,it.x||0,f.w?1.4:.01,it.z||0);obj.userData={id:f.id,price:f.p,name:f.n,canRot:true};W.scene.add(obj);W.placed.push(obj);W.total+=f.p;c++});updB();hint('Loaded: '+pb.n+' ('+c+' items)');document.getElementById('prePop').classList.remove('show')};el.appendChild(d)});document.getElementById('prePop').classList.add('show')};
window.showSave=function(){document.getElementById('savePop').classList.add('show');document.getElementById('pnInput').focus()};
window.doSave=async function(){const name=document.getElementById('pnInput').value.trim()||'Untitled';const items=W.placed.map(o=>({id:o.userData.id,x:Math.round(o.position.x*100)/100,y:Math.round(o.position.y*100)/100,z:Math.round(o.position.z*100)/100,ry:Math.round(o.rotation.y*100)/100,price:o.userData.price}));try{const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,items,total_cost:W.total,budget:W.budget-W.total})});const j=await r.json();hint(j.success?'✅ Saved!':'❌ '+(j.error||'Failed'));document.getElementById('savePop').classList.remove('show')}catch(e){hint('❌ Network error')}};
