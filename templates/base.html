<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}instaBuild{% endblock %} — The Future of Construction</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--g:#41ab5d;--gd:#2e8b46;--n:#0a1628;--n2:#0f1f38;--n3:#162544;--w:#fff;--b:#1e3350;--s:#7a8ba3;--r:12px;--card:#112240}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:'Source Sans 3',system-ui,sans-serif;color:#c4ccd8;background:var(--n);font-weight:400;font-size:16px;line-height:1.65;overflow-x:hidden}
    ::selection{background:var(--g);color:var(--n)}
    .container{max-width:1240px;margin:0 auto;padding:0 40px}
    header{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 0;transition:all .4s}
    header.scrolled{background:rgba(10,22,40,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04)}
    header .container{display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:18px;font-weight:800;color:var(--w);display:flex;align-items:center;gap:8px;text-decoration:none;letter-spacing:-.2px}.logo em{font-style:normal;color:var(--g)}
    .logo-mark{width:28px;height:28px;background:var(--g);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--n);font-weight:800;font-size:12px}
    nav{display:flex;gap:28px;align-items:center}nav a{color:var(--s);font-size:13.5px;font-weight:500;text-decoration:none;transition:color .2s}nav a:hover,nav a.active{color:var(--w)}
    nav a.active{color:var(--g)}
    .btn{display:inline-flex;align-items:center;padding:10px 22px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .25s;text-decoration:none}
    .btn-p{background:var(--g);color:var(--n)}.btn-p:hover{background:var(--gd);transform:translateY(-2px);box-shadow:0 8px 30px rgba(65,171,93,.35)}
    .menu-toggle{display:none;background:none;border:none;color:var(--w);font-size:24px;cursor:pointer}
    @media(max-width:900px){nav{display:none}nav.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--n2);border-bottom:1px solid var(--b);padding:20px 32px;gap:14px}.menu-toggle{display:block}.container{padding:0 24px}}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<header id="header"><div class="container">
  <a href="/" class="logo"><div class="logo-mark">iB</div>insta<em>Build</em></a>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <nav id="nav">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/solutions">Solutions</a>
    <a href="/builder" class="active">3D Builder</a>
    <a href="/contact">Contact</a>
  </nav>
</div></header>

{% block content %}{% endblock %}

<script>
window.addEventListener('scroll',()=>document.getElementById('header').classList.toggle('scrolled',window.scrollY>30));
document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('nav').classList.toggle('open'));
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
